      <tr><td>Ce que … c'est</td><td>Ce que je retiens, c'est la méthode.</td></tr>
      <tr><td>Ce dont … c'est</td><td>Ce dont nous avons besoin, c'est de temps.</td></tr></table></div>
      <p><b>Accord :</b> le verbe après <i>qui</i> s'accorde avec l'élément mis en relief : c'est nous qui avons raison. À l'écrit soutenu : <i>ce sont</i> + pluriel.</p>`,
      items:[
        C("___ la ponctuation qui pose le plus de problèmes.",["C'est","Ce qui est","Il est"],0,"C'est … qui encadre le sujet."),
        C("C'est en 2022 ___ j'ai commencé le français.",["que","où","quand"],0,"Pour un complément de temps : c'est … que, et non « où »."),
        C("C'est de ce problème ___ je voulais vous parler.",["que","dont","duquel"],0,"La préposition est déjà dans « de ce problème » : c'est … que. Autre tour possible : c'est ce problème dont je voulais parler."),
        C("___ m'inquiète, c'est l'isolement des salariés.",["Ce qui","Ce que","Qu'est-ce qui"],0,"Sujet de « inquiète » : ce qui."),
        C("___ nous avons besoin, c'est de temps.",["Ce dont","Ce que","Ce qui"],0,"avoir besoin de → ce dont."),
        C("C'est nous qui ___ raison.",["avons","ont","a"],0,"Le verbe s'accorde avec l'élément mis en relief : nous."),
        O(["Ce que","je retiens","de cette conférence,","c'est","la méthode."],"Ce que … c'est : mise en relief du complément."),
        C("Quelle phrase relève de l'écrit soutenu ?",["Ce sont les étudiants qui ont proposé cette solution.","C'est les étudiants qui a proposé cette solution.","Les étudiants, c'est eux qu'ont proposé cette solution."],0,"Ce sont + pluriel ; verbe accordé avec l'antécédent.")
      ]},
    { id:"passif", title:"Tournures impersonnelles et passives", t:"synt",
      theory:`<p>Le texte académique limite <i>je</i> et <i>on</i>. Il préfère l'impersonnel et le passif.</p>
      <div class="tw"><table><tr><th>Tournure</th><th>Exemple</th></tr>
      <tr><td>il est + adjectif + de</td><td>Il est nécessaire de repenser l'évaluation.</td></tr>
      <tr><td>il est + adjectif + que (+ subjonctif)</td><td>Il est essentiel que chacun ait accès aux ressources.</td></tr>
      <tr><td>il convient de · il s'agit de · il reste à</td><td>Il convient de souligner que…</td></tr>
      <tr><td>il apparaît que (+ indicatif) · il semble que (+ subjonctif)</td><td>Il apparaît que les résultats sont meilleurs.</td></tr>
      <tr><td>Passif : être + participe accordé</td><td>Une enquête a été menée auprès de 500 étudiants.</td></tr>
      <tr><td>Passif pronominal</td><td>Ce phénomène s'observe partout. Cela se comprend.</td></tr></table></div>`,
      items:[
        C("___ nécessaire de repenser l'évaluation.",["Il est","C'est que","Il y a"],0,"Tournure impersonnelle : il est + adjectif + de + infinitif."),
        C("Il est essentiel que chaque étudiant ___ accès aux ressources.",["ait","a","aura"],0,"il est essentiel que + subjonctif."),
        C("Il apparaît que les résultats ___ meilleurs.",["sont","soient"],0,"il apparaît que (constat) → indicatif."),
        F("Une enquête a été ___ auprès de 500 étudiants. (mener)",["menée"],"Passif : le participe s'accorde avec le sujet, une enquête."),
        C("Au passif : « Les chercheurs ont publié les résultats. »",["Les résultats ont été publiés par les chercheurs.","Les résultats ont publié les chercheurs.","Les résultats sont publiés des chercheurs."],0,"Le COD devient sujet ; le participe s'accorde."),
        C("Version impersonnelle de « On doit souligner que… » :",["Il convient de souligner que…","Il faut que souligner…","On convient souligner…"],0,"il convient de = il faut, en registre soutenu."),
        C("Quelle phrase utilise un passif pronominal ?",["Ce phénomène s'observe dans toutes les grandes villes.","Ce phénomène est observé lui-même.","Ce phénomène, on l'observe."],0,"se + verbe à valeur passive : s'observer, se comprendre."),
        C("« ___ de rappeler que la mesure reste expérimentale. »",["Il s'agit","Il se agit","C'est agit"],0,"il s'agit de + infinitif ou nom.")
      ]},
    { id:"ponct2", title:"Ponctuation avancée", t:"ponct",
      theory:`<ul><li><b>Relative explicative</b> (entre virgules, supprimable) ≠ <b>déterminative</b> (sans virgule, restreint le sens) : « Les étudiants, qui travaillent, réussissent » (tous) ; « Les étudiants qui travaillent réussissent » (ceux-là seulement).</li>
      <li><b>Deux-points :</b> explication, énumération, citation. Le constat est clair : les étudiants lisent moins.</li>
      <li><b>Point-virgule :</b> relie deux propositions parallèles ou liées par le sens.</li>
      <li><b>Virgule</b> après un complément long placé en tête ; jamais avant une complétive (affirmer que…).</li>
      <li><b>etc.</b> se termine par un seul point, jamais par des points de suspension.</li></ul>`,
      items:[
        C("Quelle phrase dit que TOUS les étudiants travaillent ?",["Les étudiants, qui travaillent, réussissent.","Les étudiants qui travaillent réussissent."],0,"Entre virgules, la relative est explicative : elle vaut pour tous."),
        C("Quelle phrase ne concerne que certains étudiants ?",["Les étudiants qui travaillent réussissent.","Les étudiants, qui travaillent, réussissent."],0,"Sans virgules, la relative est déterminative : elle restreint le groupe."),
        C("Quel signe annonce une explication ?",["les deux-points","le point-virgule","les points de suspension"],0,"« Le constat est clair : les étudiants lisent moins. »"),
        C("Quelle phrase est correcte ?",["Les chercheurs affirment que la situation s'aggrave.","Les chercheurs affirment, que la situation s'aggrave."],0,"Pas de virgule avant une complétive introduite par que."),
        C("Quelle phrase est correcte ?",["Depuis la réforme de l'université, les effectifs ont doublé.","Depuis la réforme de l'université les effectifs, ont doublé."],0,"Virgule après le complément en tête ; jamais entre le sujet et le verbe."),
        C("Pour relier deux propositions parallèles sans connecteur :",["Les uns lisent sur papier ; les autres, sur écran.","Les uns lisent sur papier : les autres, sur écran.","Les uns lisent sur papier… les autres, sur écran."],0,"Le point-virgule relie deux propositions parallèles."),
        C("Quelle fin d'énumération est correcte ?",["des livres, des revues, des journaux, etc.","des livres, des revues, des journaux, etc…","des livres, des revues, des journaux etc..."],0,"etc. se termine par un seul point.")
      ]}
  ]}
]},
{ id:"V", title:"Cohésion et cohérence", sub:"Unité 3 du programme · 20 h. Reformuler, argumenter, organiser, prendre des notes : les outils de tout texte académique.",
  units:[
  { title:"Reformuler et argumenter", also:["conn"], lessons:[
    { id:"reform", title:"La reformulation", t:"rep",
      theory:`<p><b>Marqueurs :</b> c'est-à-dire · autrement dit · en d'autres termes · à savoir · soit.</p>
      <div class="tw"><table><tr><th>Procédé</th><th>Exemple</th></tr>
      <tr><td>Nominalisation</td><td>Les prix augmentent → l'augmentation des prix</td></tr>
      <tr><td>Synonymie</td><td>augmenter → croître, progresser</td></tr>
      <tr><td>Passif</td><td>La mairie a annulé la course → La course a été annulée par la mairie</td></tr>
      <tr><td>Généralisation</td><td>les voitures, les bus, les trains → les transports</td></tr>
      <tr><td>Antonyme</td><td>ce n'est pas suffisant → c'est insuffisant</td></tr></table></div>
      <p><b>Règle d'or du résumé et de la synthèse :</b> ne jamais recopier une phrase du texte ; garder seulement les mots-clés techniques.</p>`,
      items:[
        C("Nominalisation de « Les loyers baissent » :",["la baisse des loyers","les loyers qui baissent","baisser les loyers"],0,"Nominaliser = transformer le verbe en nom."),
        F("« Le gouvernement a réformé l'université » → la ___ de l'université",["réforme"],"réformer → la réforme."),
        C("Reformulez « Ce n'est pas suffisant » :",["C'est insuffisant.","C'est pas assez.","Ce n'est pas assez suffisant."],0,"Négation → antonyme."),
        C("Généralisez : « les voitures, les bus et les trains »",["les transports","les véhicules rouges","les choses qui roulent"],0,"Un terme générique englobe la liste."),
        C("Passif de « La mairie a annulé la course » :",["La course a été annulée par la mairie.","La course a annulé la mairie.","La course est annulée de la mairie."],0,"Passif : être + participe accordé + par."),
        C("Quel marqueur introduit une reformulation ?",["autrement dit","pourtant","en outre"],0,"autrement dit = en d'autres termes."),
        F("« Les salariés s'isolent de plus en plus » → l'___ croissant des salariés",["isolement"],"s'isoler → l'isolement."),
        C("« Le chômage a fortement augmenté » → nominalisation :",["la forte hausse du chômage","le chômage fort augmenté","augmentation forte chômage"],0,"L'adverbe devient adjectif : fortement → forte.")
      ]},
    { id:"argu", title:"L'argumentation", t:"struct",
      theory:`<p><b>Thèse → arguments → exemples.</b> Un paragraphe développe un seul argument : idée directrice, explication, exemple, mini-conclusion.</p>
      <div class="tw"><table><tr><th>Type d'argument</th><th>Principe</th></tr>
      <tr><td>D'autorité</td><td>s'appuyer sur un expert ou une institution</td></tr>
      <tr><td>Par l'exemple</td><td>un cas concret, précis</td></tr>
      <tr><td>Logique</td><td>cause, conséquence</td></tr>
      <tr><td>Par analogie</td><td>comparer avec un autre domaine</td></tr>
      <tr><td>Pragmatique</td><td>les effets concrets d'une décision</td></tr></table></div>
      <p><b>Concession puis réfutation :</b> Certes…, mais… · Il est vrai que…, il n'en reste pas moins que…</p>
      <p><b>Modaliser :</b> il semble que (+ subjonctif) · force est de constater que · il est indéniable que · il serait illusoire de croire que.</p>`,
      items:[
        C("Un argument qui s'appuie sur l'avis d'un expert ou d'une institution est un argument…",["d'autorité","par analogie","pragmatique"],0,"L'autorité de la source fait la force de l'argument."),
        C("« L'université est comme une salle de sport : on n'y progresse qu'en s'entraînant. » C'est un argument…",["par analogie","d'autorité","statistique"],0,"On compare deux domaines."),
        O(["Certes,","le télétravail réduit les trajets,","mais","il isole","certains salariés."],"Concession, puis réfutation."),
        C("Quelle formule modalise une affirmation ?",["Il semble que","Il est évident et certain que","C'est comme ça"],0,"Modaliser = marquer le degré de certitude."),
        C("Il semble que le télétravail ___ une solution durable.",["soit","est"],0,"Il semble que + subjonctif (mais il me semble que + indicatif)."),
        C("Structure d'un paragraphe argumentatif :",["idée directrice → explication → exemple → mini-conclusion","exemple → exemple → exemple","conclusion → introduction → argument"],0,"Un paragraphe = une idée développée."),
        F("___ est de constater que les salariés sont plus stressés. (formule figée)",["force"],"Force est de constater que = on doit reconnaître que."),
        C("« Il est vrai que la course attire des touristes ; ___ elle met en danger les habitants. »",["il n'en reste pas moins qu'","par conséquent,","de plus,"],0,"Concession → réfutation.")
      ]},
    { id:"reprise", title:"Les reprises anaphoriques", t:"rep",
      theory:`<p>Un texte cohérent reprend ce qui a déjà été dit, sans le répéter.</p>
      <div class="tw"><table><tr><th>Reprise</th><th>Exemple</th></tr>
      <tr><td>Pronominale</td><td>il, le, en, y · celui-ci · ce dernier (le dernier nommé)</td></tr>
      <tr><td>Nominale fidèle</td><td>une réforme… cette réforme</td></tr>
      <tr><td>Par un terme général</td><td>le télétravail… ce mode d'organisation</td></tr>
      <tr><td>Résomptive (toute une phrase)</td><td>Les loyers ont doublé. Cette hausse… · Ce phénomène… · Une telle situation…</td></tr></table></div>
      <p><b>Celui-ci / celui-là :</b> celui-ci renvoie au plus proche, c'est-à-dire au dernier nommé ; celui-là, au premier.</p>`,
      items:[
        C("« Les loyers ont doublé en dix ans. ___ inquiète les familles. »",["Cette hausse","Ce hausse","Cela hausse"],0,"Un nom résume toute la phrase précédente."),
        C("« Le ministre a rencontré le recteur ; ___ a promis de nouveaux moyens. » (= le recteur)",["ce dernier","celui-là","lui-même"],0,"ce dernier = la dernière personne nommée."),
        C("« Le télétravail se développe. ___ séduit surtout les cadres. »",["Ce mode d'organisation","Cette télétravail","Ce télétravaille"],0,"Reprise par un terme plus général."),
        C("« Étudiants et enseignants ont voté : ___ ont approuvé la réforme, ceux-ci l'ont rejetée. » (= les étudiants)",["ceux-là","ceux-ci","eux"],0,"ceux-là = les premiers nommés ; ceux-ci = les derniers."),
        C("« Une réforme a été annoncée. ___ réforme divise l'université. »",["Cette","Une","La même une"],0,"Reprise fidèle avec un démonstratif."),
        C("« Des solutions ? Les experts ___ proposent plusieurs. »",["en","les","y"],0,"en reprend un nom introduit par de ou des."),
        C("Quelle phrase évite la répétition ?",["La mairie a présenté un projet ; celui-ci a été mal accueilli.","La mairie a présenté un projet ; le projet a été mal accueilli.","La mairie a présenté un projet ; le projet de la mairie a été mal accueilli."],0,"celui-ci reprend « un projet ».")
      ]},
    { id:"rapport", title:"Le discours rapporté", t:"conj",
      theory:`<p>Quand le verbe introducteur est au passé, les temps se décalent : c'est la <b>concordance des temps</b>.</p>
      <div class="tw"><table><tr><th>Discours direct</th><th>Discours indirect</th></tr>
      <tr><td>présent : « Je suis prêt. »</td><td>imparfait : Il a dit qu'il était prêt.</td></tr>
      <tr><td>passé composé : « J'ai fini. »</td><td>plus-que-parfait : qu'il avait fini.</td></tr>
      <tr><td>futur : « Je viendrai. »</td><td>conditionnel : qu'il viendrait.</td></tr>
      <tr><td>impératif : « Venez ! »</td><td>de + infinitif : Il nous a demandé de venir.</td></tr>
      <tr><td>« Viens-tu ? » · « Que veux-tu ? »</td><td>si je venais · ce que je voulais</td></tr>
      <tr><td>demain · hier · aujourd'hui</td><td>le lendemain · la veille · ce jour-là</td></tr></table></div>`,
      items:[
        C("« Je suis fatigué. » → Il a dit qu'il ___ fatigué.",["était","est","sera"],0,"Présent → imparfait."),
        C("« J'ai terminé le rapport. » → Elle a affirmé qu'elle ___ le rapport.",["avait terminé","a terminé","terminerait"],0,"Passé composé → plus-que-parfait."),
        C("« Nous publierons les résultats. » → Ils ont annoncé qu'ils ___ les résultats.",["publieraient","publieront","publiaient"],0,"Futur → conditionnel présent."),
        C("« Rendez vos copies ! » → Le professeur nous a demandé ___ nos copies.",["de rendre","que nous rendons","rendre"],0,"Impératif → de + infinitif."),
        C("« Est-ce que tu viens ? » → Il m'a demandé ___ je venais.",["si","que","ce que"],0,"Question fermée → si."),
        C("« Qu'est-ce que tu penses ? » → Elle m'a demandé ___ je pensais.",["ce que","qu'est-ce que","que"],0,"Qu'est-ce que → ce que : l'erreur relevée à votre diagnostic."),
        C("« Je partirai demain. » → Il a dit qu'il partirait ___.",["le lendemain","demain","hier"],0,"demain → le lendemain ; hier → la veille."),
        F("« Je comprends le problème. » → Elle a reconnu qu'elle ___ le problème. (comprendre)",["comprenait"],"Présent → imparfait.")
      ]}
  ]},
  { title:"Relations logiques", lessons:[
    { id:"cause", title:"Cause et conséquence", t:"coh",
      theory:`<div class="tw"><table><tr><th>Relation</th><th>Outils</th></tr>
      <tr><td>Cause + nom</td><td>grâce à (positif) · à cause de (négatif) · en raison de (neutre, soutenu) · faute de (manque) · du fait de</td></tr>
      <tr><td>Cause + verbe</td><td>parce que · puisque (cause connue) · étant donné que · dans la mesure où · sous prétexte que (cause contestée)</td></tr>
      <tr><td>Conséquence</td><td>donc · par conséquent · c'est pourquoi · si bien que · de sorte que · au point que · tant / tellement … que · d'où + nom</td></tr></table></div>`,
      items:[
        C("Il a réussi ___ son travail régulier.",["grâce à","à cause de","faute de"],0,"grâce à : cause positive."),
        C("Le vol a été annulé ___ la tempête.",["en raison de","grâce à","faute de"],0,"en raison de : cause neutre, registre soutenu."),
        C("___ moyens, le projet a été abandonné.",["Faute de","Grâce à","Parce que"],0,"faute de + nom sans article : par manque de."),
        C("___ vous connaissez le sujet, je serai bref.",["Puisque","Sous prétexte que","Faute de"],0,"puisque : cause déjà connue de l'interlocuteur."),
        C("Il n'est pas venu ___ il était malade, mais personne ne l'a cru.",["sous prétexte qu'","grâce à ce qu'","d'où"],0,"sous prétexte que : cause présentée comme douteuse."),
        C("Les loyers ont augmenté, ___ le départ des familles.",["d'où","si bien que","parce que"],0,"d'où + nom : conséquence."),
        C("Il a tant travaillé ___ il est tombé malade.",["qu'","donc","si bien"],0,"tant … que : conséquence liée à l'intensité."),
        O(["Les cours étaient en ligne,","si bien que","de nombreux étudiants","se sont sentis","isolés."],"si bien que + indicatif : conséquence.")
      ]},
    { id:"conces", title:"Opposition et concession", t:"coh",
      theory:`<p><b>Opposition</b> (deux faits contrastés) : alors que, tandis que (+ indicatif), en revanche, au contraire, contrairement à.</p>
      <p><b>Concession</b> (un fait qui n'empêche pas l'autre) :</p>
      <div class="tw"><table><tr><th>Outil</th><th>Construction</th></tr>
      <tr><td>bien que · quoique</td><td>+ subjonctif : bien qu'il pleuve</td></tr>
      <tr><td>même si</td><td>+ indicatif : même s'il pleut</td></tr>
      <tr><td>malgré · en dépit de</td><td>+ nom : malgré la pluie</td></tr>
      <tr><td>avoir beau</td><td>+ infinitif : il a beau étudier…</td></tr>
      <tr><td>quand bien même</td><td>+ conditionnel : quand bien même il le voudrait…</td></tr></table></div>
      <p><b>À éviter à l'écrit :</b> « malgré que ». <b>Attention :</b> quoique (= bien que) ≠ quoi que (= quelle que soit la chose que).</p>`,
      items:[
        C("___ il pleuve, le match aura lieu.",["Bien qu'","Même s'","Malgré qu'"],0,"bien que + subjonctif (pleuve)."),
        C("___ il pleut, le match aura lieu.",["Même s'","Bien qu'","Quoiqu'"],0,"même si + indicatif (pleut)."),
        C("___ la pluie, le match a eu lieu.",["Malgré","Bien que","Même si"],0,"malgré + nom."),
        C("Il ___ beau étudier, il oublie les accords.",["a","est","fait"],0,"avoir beau + infinitif : même s'il étudie beaucoup."),
        C("Les uns lisent sur écran, ___ les autres préfèrent le papier.",["tandis que","bien que","malgré"],0,"tandis que : opposition entre deux faits simultanés."),
        C("Quelle phrase convient à l'écrit soutenu ?",["Bien qu'il soit tard, nous continuons.","Malgré qu'il soit tard, nous continuons."],0,"« Malgré que » est à éviter : bien que."),
        C("___ vous me le demanderiez, je ne changerais pas d'avis.",["Quand bien même","Bien que","Malgré"],0,"quand bien même + conditionnel : hypothèse concessive."),
        C("« Quoiqu'il soit fatigué » signifie…",["bien qu'il soit fatigué","quelle que soit la chose qu'il fasse","parce qu'il est fatigué"],0,"quoique en un mot = bien que ; quoi que en deux mots = quelle que soit la chose que.")
      ]},
    { id:"but", title:"But, condition, hypothèse", t:"conj",
      theory:`<div class="tw"><table><tr><th>Relation</th><th>Outils</th></tr>
      <tr><td>But</td><td>pour que · afin que (+ subjonctif) · de peur que · de crainte que (+ subjonctif, souvent avec ne) · pour · afin de (+ infinitif) · en vue de (+ nom)</td></tr>
      <tr><td>Condition</td><td>si (+ indicatif) · à condition que · pourvu que · à moins que (+ subjonctif) · au cas où (+ conditionnel) · en cas de (+ nom)</td></tr></table></div>
      <p><b>Même sujet → infinitif :</b> je travaille pour réussir, et non « pour que je réussisse ».</p>`,
      items:[
        C("Le professeur répète la consigne ___ tout le monde la comprenne.",["pour que","pour","parce que"],0,"Deux sujets différents : pour que + subjonctif."),
        C("Je relis mon texte ___ corriger mes accords.",["pour","pour que","afin que"],0,"Même sujet : pour + infinitif."),
        C("Nous partirons tôt, de peur que la route ne ___ bloquée.",["soit","est","sera"],0,"de peur que + subjonctif, avec ne explétif."),
        C("Je viendrai, ___ il ne pleuve.",["à moins qu'","au cas où","si"],0,"à moins que + subjonctif = sauf si."),
        C("Au cas où tu ___ en retard, préviens-moi.",["serais","sois","es"],0,"au cas où + conditionnel."),
        C("Tu peux sortir, à condition que tu ___ avant minuit.",["reviennes","reviendras","reviens"],0,"à condition que + subjonctif."),
        C("___ panne, appelez ce numéro.",["En cas de","Au cas où","À condition de"],0,"en cas de + nom."),
        O(["Il faut agir","dès maintenant","afin que","les générations futures","ne soient pas pénalisées."],"afin que + subjonctif.")
      ]}
  ]},
  { title:"Organiser le texte", lessons:[
    { id:"plans", title:"Les plans du texte académique", t:"struct",
      theory:`<div class="tw"><table><tr><th>Plan</th><th>Parties</th><th>Pour</th></tr>
      <tr><td>Dialectique</td><td>thèse · antithèse · dépassement</td><td>une question fermée (Faut-il… ?)</td></tr>
      <tr><td>Analytique</td><td>constat · causes · conséquences · solutions</td><td>un problème à expliquer</td></tr>
      <tr><td>Thématique</td><td>aspects : économique, social, environnemental…</td><td>une question ouverte, la synthèse</td></tr>
      <tr><td>Comparatif</td><td>points communs · différences</td><td>deux objets, deux points de vue</td></tr></table></div>
      <p><b>Introduction :</b> amorce · présentation du sujet · problématique · annonce du plan. <b>Conclusion :</b> bilan · réponse · ouverture.</p>`,
      items:[
        C("Sujet : « Faut-il interdire les voitures en centre-ville ? » Plan le plus adapté :",["dialectique : pour / contre / dépassement","analytique : constat / causes / solutions","chronologique"],0,"Question fermée → plan dialectique."),
        C("Sujet : « La hausse du stress au travail » Plan le plus adapté :",["analytique : constat / causes / conséquences / solutions","dialectique : pour / contre","comparatif"],0,"Un phénomène à expliquer → plan analytique."),
        O(["Amorce","Présentation du sujet","Problématique","Annonce du plan"],"Les quatre temps de l'introduction.",{q:"Remettez les étapes de l'introduction dans l'ordre."}),
        C("Quelle phrase annonce le plan ?",["Nous verrons d'abord les avantages du télétravail, puis nous en examinerons les limites.","Le télétravail est un sujet intéressant.","Pour conclure, le télétravail est utile."],0,"Annoncer = nommer les parties à venir."),
        C("Quelle amorce convient à un essai sur l'IA à l'université ?",["En quelques années, les outils d'intelligence artificielle se sont invités dans les salles de cours.","Je vais parler de l'IA.","L'IA, c'est quoi ?"],0,"Une amorce situe le sujet dans l'actualité."),
        C("Pour une synthèse de documents, on privilégie…",["un plan thématique qui croise les documents","un plan document par document","un plan chronologique"],0,"La synthèse confronte les documents idée par idée."),
        C("Dans un plan dialectique, la troisième partie…",["dépasse l'opposition par une position nuancée","répète la thèse","ajoute des exemples sans lien"],0,"C'est le dépassement.")
      ]},
    { id:"notes", title:"La prise de notes", t:"co",
      theory:`<p>On note les idées, pas les phrases : mots-clés, chiffres, dates, noms, et surtout les <b>liens logiques</b>.</p>
      <div class="tw"><table><tr><th>Signe</th><th>Sens</th><th>Signe</th><th>Sens</th></tr>
      <tr><td>→</td><td>entraîne, cause</td><td>≠</td><td>différent, opposé</td></tr>
      <tr><td>↑ / ↓</td><td>hausse / baisse</td><td>∅</td><td>absence</td></tr>
      <tr><td>+ / =</td><td>et, plus / égal, signifie</td><td>cf. · ex.</td><td>voir · exemple</td></tr>
      <tr><td>pb · gvt</td><td>problème · gouvernement</td><td>qqn · qqch</td><td>quelqu'un · quelque chose</td></tr>
      <tr><td>°</td><td>-tion (popula°)</td><td>tjs · ds · env.</td><td>toujours · dans · environ</td></tr></table></div>
      <p>Structurez la page (1, 2 ; a, b) et laissez une marge pour compléter après l'écoute.</p>`,
      items:[
        C("Symbole pour « entraîne, a pour conséquence » :",["→","≠","∅"],0,"La flèche marque la conséquence."),
        C("« ↑ chômage » signifie…",["hausse du chômage","baisse du chômage","absence de chômage"],0,"↑ = hausse."),
        C("« gvt » est l'abréviation de…",["gouvernement","gouvernant","gravement"],0,"On garde les consonnes clés."),
        C("Que faut-il noter en priorité ?",["mots-clés, chiffres, dates, noms et liens logiques","toutes les phrases mot à mot","uniquement les exemples"],0,"On note les idées, pas les phrases."),
        C("Écoutez l'extrait. Quelle prise de notes est la plus fidèle ?",["télétravail : 1/4 salariés → ↓ trajets, mais ↑ isolement","télétravail = bien","4 salariés en télétravail"],0,"Chiffre + relation logique + opposition.",{say:"Dans l'entreprise étudiée, un quart des salariés travaillent à distance. Les trajets ont diminué, mais l'isolement a nettement augmenté."}),
        C("Notez l'information essentielle :",["14 h 15 · durée 90 min","4 h 15 · durée 19 min","14 h 50 · durée 70 min"],0,"quatorze heures quinze, quatre-vingt-dix minutes.",{say:"Le cours commence à quatorze heures quinze et dure quatre-vingt-dix minutes."}),
        C("« popula° » se lit…",["population","populaire","populiste"],0,"Le ° remplace la terminaison -tion."),
        LI("Dans ce groupe, trente-huit pour cent des étudiants prennent leurs notes sur ordinateur.",["38"],"trente-huit pour cent.")
      ]}
  ]}
]},
{ id:"VI", title:"Le texte académique", sub:"Unité 4 du programme · 40 h, le cœur du semestre. Les partiels des semaines 6, 11 et 16 suivent le modèle du DALF C1.",
  units:[
  { title:"Réduire un texte", lessons:[
    { id:"resume", title:"Le résumé", t:"consigne",
      theory:`<ul><li><b>Réduire</b> le texte au quart ou au tiers : le nombre de mots est imposé, avec une tolérance de 10 % en plus ou en moins.</li>
      <li><b>Respecter</b> l'ordre des idées et le point de vue de l'auteur : on écrit à sa place, sans « l'auteur dit », sans « je ».</li>
      <li><b>Aucune</b> opinion personnelle, aucune information extérieure.</li>
      <li><b>Reformuler :</b> ne pas recopier ; garder les liens logiques.</li>
      <li><b>Compter :</b> un mot est séparé par une espace ou une apostrophe. « C'est » = 2 mots, « l'université » = 2 mots.</li></ul>
      <p><b>Méthode :</b> repérer la thèse et le plan → souligner les idées essentielles, barrer exemples et répétitions → reformuler paragraphe par paragraphe → compter.</p>`,
      items:[
        C("Dans un résumé, peut-on écrire « L'auteur affirme que… » ?",["Non : on reprend l'énonciation de l'auteur, sans le nommer","Oui, c'est obligatoire","Seulement dans la conclusion"],0,"C'est le compte rendu qui nomme l'auteur."),
        C("Texte de 400 mots, résumé au quart. Combien de mots ?",["100 mots (entre 90 et 110)","40 mots","200 mots"],0,"400 ÷ 4 = 100, tolérance de 10 %."),
        C("Combien de mots compte « C'est l'université qui décide » ?",["6","4","5"],0,"C' | est | l' | université | qui | décide."),
        C("Que supprime-t-on d'abord ?",["les exemples et les répétitions","la thèse","les connecteurs logiques"],0,"On garde les idées et les liens logiques."),
        C("Un résumé peut-il contenir votre opinion ?",["Non, jamais","Oui, à la fin","Oui, si elle est nuancée"],0,"Le résumé est fidèle et objectif."),
        C("Meilleur résumé de : « Les étudiants utilisent de plus en plus l'intelligence artificielle pour rédiger leurs devoirs, ce qui inquiète les enseignants, lesquels craignent une perte d'autonomie intellectuelle. »",["Le recours croissant des étudiants à l'IA fait craindre aux enseignants un affaiblissement de leur autonomie intellectuelle.","Les étudiants utilisent de plus en plus l'IA pour rédiger leurs devoirs.","Je pense que l'IA est dangereuse pour les étudiants."],0,"Reformulé, condensé, fidèle, sans opinion."),
        C("Dans un résumé, on respecte…",["l'ordre des idées du texte","l'ordre de ses préférences","un ordre alphabétique"],0,"Le résumé suit le fil du texte.")
      ]},
    { id:"cr", title:"Le compte rendu", t:"consigne",
      theory:`<p><b>Différence avec le résumé :</b> on présente le document (auteur, titre, source, date, thème) et on rend compte de la pensée de l'auteur à la troisième personne. On peut réorganiser les idées. Le ton reste objectif, au présent.</p>
      <p><i>Dans cet article paru dans Le Monde, la sociologue s'interroge sur l'avenir du télétravail.</i></p>
      <div class="tw"><table><tr><th>Verbe introducteur</th><th>Sens</th></tr>
      <tr><td>affirmer, soutenir, souligner</td><td>présenter une idée avec force</td></tr>
      <tr><td>rappeler, constater</td><td>un fait connu, observé</td></tr>
      <tr><td>déplorer</td><td>regretter</td></tr>
      <tr><td>dénoncer</td><td>critiquer publiquement</td></tr>
      <tr><td>reconnaître, admettre</td><td>concéder</td></tr>
      <tr><td>préconiser, recommander</td><td>proposer une solution</td></tr>
      <tr><td>s'interroger sur, nuancer, réfuter</td><td>questionner, modérer, rejeter</td></tr></table></div>`,
      items:[
        C("L'auteur regrette la disparition des cours en présentiel. Verbe introducteur :",["déplore","préconise","rappelle"],0,"déplorer = regretter."),
        C("L'auteur propose une solution concrète :",["préconise","dénonce","constate"],0,"préconiser = recommander."),
        C("L'auteur critique fortement une injustice :",["dénonce","nuance","reconnaît"],0,"dénoncer = critiquer publiquement."),
        C("L'auteur admet un argument adverse :",["reconnaît","réfute","déplore"],0,"reconnaître = concéder."),
        O(["Dans cet article","paru dans Le Monde,","la sociologue","s'interroge sur","l'avenir du télétravail."],"Présenter le document en une phrase."),
        C("Différence principale entre résumé et compte rendu :",["Le compte rendu nomme l'auteur et peut réorganiser les idées","Le résumé donne l'opinion de l'étudiant","Aucune différence"],0,"Le compte rendu parle du texte ; le résumé parle à sa place."),
        C("À quel temps rédige-t-on un compte rendu ?",["au présent","au passé simple","au futur"],0,"Présent de narration."),
        F("L'auteure ___ que la reconversion est souvent un choix contraint. (souligner)",["souligne"],"Présent, 3e personne : souligne.")
      ]}
  ]},
  { title:"Écrire en universitaire", lessons:[
    { id:"acad", title:"Le registre académique", t:"registre",
      theory:`<ul><li><b>Objectivité :</b> limiter « je » ; préférer le « nous » d'auteur ou l'impersonnel.</li>
      <li><b>Verbes précis :</b> montrer → mettre en évidence · dire → affirmer, souligner · faire → effectuer, mener · être → constituer, représenter, s'avérer.</li>
      <li><b>À éviter :</b> les généralisations (« tout le monde sait que »), les mots vagues (chose, truc, gens), les exclamations, les anglicismes inutiles (feedback → retour, deadline → échéance, challenge → défi).</li>
      <li><b>Nuancer :</b> dans une certaine mesure · en partie · semble-t-il.</li></ul>`,
      items:[
        C("Version académique de « Cette étude montre des choses intéressantes. » :",["Cette étude met en évidence plusieurs résultats significatifs.","Cette étude montre des trucs intéressants.","Cette étude, elle montre plein de choses !"],0,"Verbe précis, nom précis, ton neutre."),
        C("Remplacez l'anglicisme : « Nous attendons votre feedback. »",["votre retour","votre feed-back","votre réponse feedback"],0,"feedback → retour, avis."),
        C("Remplacez « deadline » :",["échéance","dead-ligne","délai final line"],0,"deadline → date limite, échéance."),
        C("Quelle phrase évite la généralisation ?",["Une partie des chercheurs estime que…","Tout le monde sait que…","Les gens pensent que…"],0,"On précise qui pense quoi."),
        C("« Cette hypothèse ___ fausse. » (se révéler)",["s'avère","se révèle être que","est révélée"],0,"s'avérer = se révéler, registre soutenu."),
        C("Quelle phrase relève du registre académique ?",["Nous examinerons d'abord les causes de ce phénomène.","Je vais d'abord regarder les causes du truc.","On va voir les causes, hein."],0,"« Nous » d'auteur, verbe précis."),
        C("Pour nuancer une affirmation :",["Cette réforme semble, dans une certaine mesure, efficace.","Cette réforme est super efficace !","Cette réforme est totalement parfaite."],0,"Modalisation et prudence."),
        C("« Le chômage ___ la principale préoccupation des jeunes. » (plus précis que « est »)",["constitue","fait","a"],0,"constituer, représenter à la place de être.")
      ]},
    { id:"citer", title:"Citer ses sources", t:"ponct",
      theory:`<ul><li><b>Citation courte</b> intégrée entre guillemets français : Selon l'auteure, « la lecture reste un acte de liberté ».</li>
      <li><b>Coupure</b> signalée par […] ; <b>ajout</b> entre crochets : « Les étudiants [de licence] lisent moins. »</li>
      <li><b>Paraphrase :</b> on reformule et on indique la source, sans guillemets : D'après Garnier et Savage, …</li>
      <li><b>Référence</b> auteur-date : (Garnier et Savage, 2018, p. 45).</li>
      <li><b>Plagiat :</b> recopier sans guillemets ni source.</li>
      <li><b>Synthèse du DALF C1 :</b> on reformule, on ne cite pas mot pour mot.</li></ul>`,
      items:[
        C("Quelle citation est correctement intégrée ?",["Selon l'auteure, « la lecture reste un acte de liberté ».","Selon l'auteure, \"la lecture reste un acte de liberté\".","Selon l'auteure la lecture reste un acte de liberté."],0,"Guillemets français « » avec espaces intérieures."),
        C("Pour signaler un passage supprimé dans une citation :",["[…]","(...)","etc."],0,"Crochets et points de suspension."),
        C("Une paraphrase…",["reformule l'idée et indique la source, sans guillemets","recopie le texte sans guillemets","n'a pas besoin de source"],0,"Reformuler et citer la source."),
        C("Recopier un passage sans guillemets ni source, c'est…",["du plagiat","une paraphrase","une synthèse"],0,"Même involontaire, c'est une faute grave."),
        C("Dans la synthèse du DALF C1, il faut…",["reformuler les idées plutôt que citer mot pour mot","recopier les phrases clés","citer chaque document entre guillemets"],0,"La synthèse évalue la reformulation."),
        C("Référence au format auteur-date :",["(Garnier et Savage, 2018, p. 45)","(p. 45 Garnier 2018 et Savage)","[Garnier-Savage-2018]"],0,"Auteurs, année, page."),
        C("« Les étudiants [de licence] lisent moins qu'avant. » Les crochets indiquent…",["un ajout de la personne qui cite","la citation d'un autre auteur","une erreur de l'auteur"],0,"On ajoute entre crochets un mot nécessaire à la compréhension.")
      ]}
  ]},
  { title:"Les épreuves du DALF C1", lessons:[
    { id:"synth", title:"La synthèse", t:"consigne",
      theory:`<p><b>Au DALF C1</b>, la production écrite dure 2 h 30 : une synthèse de plusieurs documents (environ 1 000 mots au total) en environ 220 mots, puis un essai argumentatif sur le même thème.</p>
      <ul><li>Un <b>titre</b> qui reflète le thème commun.</li>
      <li>Une <b>introduction</b> : thème et problématique.</li>
      <li>Un <b>développement thématique</b> qui confronte les documents : convergences, divergences. Jamais document par document.</li>
      <li>Une <b>conclusion</b> brève.</li>
      <li><b>Interdit :</b> votre opinion, une information extérieure, les citations recopiées.</li></ul>
      <p><b>Confronter :</b> de même · à l'instar de · tout comme · contrairement à · alors que · tandis que · les auteurs s'accordent à dire que… · divergent sur…</p>`,
      items:[
        C("Longueur attendue de la synthèse au DALF C1 :",["environ 220 mots","environ 80 mots","500 mots minimum"],0,"Environ 220 mots ; on indique le nombre à la fin."),
        C("Dans une synthèse, on…",["confronte les documents idée par idée","résume chaque document l'un après l'autre","donne son avis en conclusion"],0,"Plan thématique croisé."),
        C("Les deux auteurs sont du même avis. Formule :",["Les deux auteurs s'accordent à dire que…","Le document 1 dit ça et le 2 aussi.","Moi aussi, je pense que…"],0,"S'accorder à dire = être d'accord."),
        C("Pour opposer deux points de vue :",["Contrairement à l'économiste, la sociologue estime que…","Comme l'économiste, la sociologue estime que…","L'économiste et la sociologue, c'est pareil."],0,"Contrairement à marque la divergence."),
        C("Peut-on ajouter un exemple personnel ou une information extérieure ?",["Non : seulement le contenu des documents","Oui, pour enrichir","Oui, dans l'introduction"],0,"La synthèse ne contient que les idées des documents."),
        C("La synthèse doit avoir…",["un titre","une signature","une formule de politesse"],0,"Un titre qui annonce le thème commun."),
        O(["Titre","Introduction : thème et problématique","Première partie : convergences","Deuxième partie : divergences","Conclusion brève"],"Un plan possible pour une synthèse.",{q:"Remettez le plan de la synthèse dans l'ordre."})
      ]},
    { id:"essai", title:"L'essai argumentatif", t:"struct",
      theory:`<ul><li><b>250 mots minimum</b> au DALF C1, sur le thème des documents de la synthèse.</li>
      <li>La consigne impose parfois une <b>forme</b> : article, lettre, contribution à un débat. La respecter fait partie de la note.</li>
      <li>Ici, <b>votre opinion est attendue</b> : une thèse claire et nuancée.</li>
      <li><b>Introduction</b> (amorce, problématique, annonce du plan) · <b>développement</b> en deux ou trois parties · <b>conclusion</b> (bilan, réponse, ouverture).</li></ul>
      <p><b>S'engager :</b> j'estime que · je suis convaincu que · il me paraît essentiel de. <b>Nuancer :</b> certes… · il serait réducteur de…</p>`,
      items:[
        C("Longueur minimale de l'essai au DALF C1 :",["250 mots","150 mots","400 mots"],0,"250 mots minimum."),
        C("Dans l'essai, votre opinion…",["est attendue, claire et nuancée","est interdite","doit rester implicite"],0,"C'est la grande différence avec la synthèse."),
        C("Formule d'engagement soutenue :",["Je suis convaincu que","Moi je dis que","C'est trop vrai que"],0,"Registre soutenu."),
        C("Si la consigne demande un article pour un journal, il faut…",["un titre et une forme d'article","une formule de politesse finale","écrire sans paragraphes"],0,"La forme fait partie de la consigne."),
        O(["Il serait réducteur","de voir dans l'IA","une simple menace","pour l'université."],"Nuancer avant d'argumenter."),
        C("Un bon paragraphe argumentatif commence par…",["l'idée directrice","un exemple isolé","la conclusion"],0,"Le lecteur doit savoir d'emblée ce que le paragraphe démontre."),
        C("Quelle conclusion convient ?",["En définitive, l'IA peut devenir une alliée de l'université, à condition d'en encadrer l'usage. Reste à savoir si les enseignants y seront formés à temps.","Voilà mon essai.","Et puis l'IA existe aussi dans les jeux vidéo."],0,"Bilan, réponse, ouverture.")
      ]},
    { id:"oralc1", title:"L'oral du DALF C1", t:"struct",
      theory:`<p><b>L'épreuve :</b> une heure de préparation à partir de plusieurs documents écrits, puis environ trente minutes de passation : un exposé de 8 à 10 minutes, suivi d'un débat avec le jury.</p>
      <ul><li><b>Exposé :</b> introduction (thème, problématique, plan annoncé) · deux ou trois parties appuyées sur les documents, avec votre point de vue · conclusion.</li>
      <li><b>Notes :</b> des mots-clés et un plan, jamais un texte à lire.</li>
      <li><b>Transitions :</b> Je voudrais d'abord… · J'en viens maintenant à… · Pour conclure…</li>
      <li><b>Débat :</b> Si je comprends bien votre question… · Je vous l'accorde en partie ; cependant… · Permettez-moi de nuancer.</li></ul>`,
      items:[
        C("Durée de préparation de l'oral du DALF C1 :",["1 heure","10 minutes","3 heures"],0,"Une heure de préparation, puis environ trente minutes de passation."),
        C("L'exposé du DALF C1 dure environ…",["8 à 10 minutes","2 minutes","30 minutes"],0,"Il est suivi d'un débat avec le jury."),
        C("Pour passer à la deuxième partie :",["J'en viens maintenant à…","Euh, et après…","Deuxième chose, bon…"],0,"Une transition explicite."),
        C("Vos notes pendant l'exposé doivent être…",["des mots-clés et un plan","un texte complet à lire","inexistantes"],0,"On parle à partir d'un plan, on ne lit pas."),
        C("Le jury conteste votre idée. Réponse la plus efficace :",["Je vous l'accorde en partie ; cependant, …","Non, vous avez tort.","Je ne sais pas."],0,"Concéder, puis défendre."),
        C("Vous n'avez pas bien compris la question :",["Si je comprends bien, vous me demandez si…","Quoi ?","Tu peux répéter ?"],0,"Reformuler la question, en vouvoyant."),
        O(["Je voudrais d'abord","présenter les documents,","puis","analyser leurs points de vue,","avant de","donner ma position."],"Annonce du plan de l'exposé."),
        C("Dans l'exposé du DALF C1, votre point de vue…",["est attendu, appuyé sur les documents","est interdit","doit remplacer les documents"],0,"On s'appuie sur les documents et on prend position.")
      ]}
  ]},
  { title:"Projet", lessons:[
    { id:"p-synth", project:true, title:"Synthèse : le télétravail", t:"consigne",
      theory:`<p><b>Projet.</b> Deux documents courts, deux points de vue opposés. Vous préparez la synthèse étape par étape, puis vous la rédigez dans l'<b>Atelier</b>. <i>Ces documents sont des textes d'entraînement.</i></p>
      <p class="consigne"><b>Document 1 — Le télétravail, une conquête sociale.</b> ${DOC_TT1}</p>
      <p class="consigne"><b>Document 2 — Seuls devant l'écran.</b> ${DOC_TT2}</p>`,
      items:[
        C("Quel est le thème commun aux deux documents ?",["Les effets du télétravail sur les salariés et les entreprises","La crise sanitaire","Les dépenses de bureaux"],0,"Le thème englobe les deux documents."),
        C("Sur quel point les deux documents convergent-ils ?",["Le télétravail présente de réels avantages","Il faut le généraliser à tous les métiers","Il isole les salariés"],0,"Document 2 : « Si le télétravail séduit… »"),
        C("Point de divergence principal :",["Généralisation (document 1) contre usage partiel et encadré (document 2)","Le coût des bureaux","La date de la crise sanitaire"],0,"C'est la tension à mettre en valeur."),
        C("Meilleur titre pour la synthèse :",["Le télétravail : conquête sociale ou source d'isolement ?","Mon avis sur le télétravail","Document 1 et document 2"],0,"Le titre annonce le thème et la tension."),
        C("Meilleure problématique :",["Dans quelle mesure le télétravail améliore-t-il réellement les conditions de travail ?","Le télétravail est-il bien ?","Qui a écrit ces documents ?"],0,"Une question ouverte, avec inversion du sujet."),
        SP("Les deux auteurs reconnaissent les avantages du télétravail , et [je] [pense] qu'il faut le généraliser .","(supprimer l'opinion personnelle)","Pas d'opinion dans une synthèse."),
        C("Reformulez « une meilleure conciliation entre vie professionnelle et vie familiale » :",["un meilleur équilibre entre travail et vie privée","une vie familiale professionnelle","une conciliation meilleure"],0,"Reformuler sans recopier."),
        O(["Contrairement à l'économiste,","la psychologue","estime que le télétravail","doit rester","partiel et encadré."],"Confronter les points de vue.")
      ]},
    { id:"p-resume", project:true, title:"Résumé guidé : l'IA à l'université", t:"consigne",
      theory:`<p><b>Projet.</b> Vous préparez le résumé du texte ci-dessous étape par étape, puis vous le rédigez dans l'<b>Atelier</b> (70 mots, ± 10 %).</p>
      <p class="consigne" style="white-space:pre-line">${DOC_IA}</p>`,
      items:[

function dCost(r,h){

  if(pr&&ph) return 1; if(pr||ph) return 2.5;
  const a=noAcc(r.toLowerCase()),b=noAcc(h.toLowerCase()); if(a===b) return .4;
  let i=0; while(i<a.length&&i<b.length&&a[i]===b[i]) i++;
  return i>=3?.8:1.4;
}
function dAlign(R,H){
  const n=R.length,m=H.length; const D=[]; for(let i=0;i<=n;i++){D.push(new Float64Array(m+1));}
  for(let i=1;i<=n;i++) D[i][0]=i; for(let j=1;j<=m;j++) D[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++) D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+dCost(R[i-1],H[j-1]));
  const ops=[]; let i=n,j=m;
  while(i>0||j>0){
    if(i>0&&j>0&&Math.abs(D[i][j]-(D[i-1][j-1]+dCost(R[i-1],H[j-1])))<1e-9){ ops.push({op:R[i-1]===H[j-1]?"eq":"sub",r:R[i-1],h:H[j-1]}); i--; j--; }
    else if(i>0&&Math.abs(D[i][j]-(D[i-1][j]+1))<1e-9){ ops.push({op:"del",r:R[i-1]}); i--; }
    else { ops.push({op:"ins",h:H[j-1]}); j--; }
  }
  return ops.reverse();
}
function dClassify(o,alts){
  if(o.op==="eq") return null;
  if(o.op==="del") return isP(o.r)?(o.r==="-"?"trait":"ponct"):"oubli";
  if(o.op==="ins") return isP(o.h)?(o.h==="-"?"trait":"ponct"):"ajout";
  const r=o.r,h=o.h;
  if(alts&&alts[r]&&alts[r].includes(h)) return null;
  if(isP(r)&&isP(h)) return (r==="-"||h==="-")?"trait":"ponct";
  if(isP(r)||isP(h)) return "ortho";
  if(r.toLowerCase()===h.toLowerCase()) return "maj";
  if(homo(r,h)) return "homo";
  const a=noAcc(r.toLowerCase()),b=noAcc(h.toLowerCase());
  if(a===b) return "accent";
  let i=0; while(i<a.length&&i<b.length&&a[i]===b[i]) i++;
  if(i>=3&&i>=Math.min(a.length,b.length)-3){
    const sa=r.toLowerCase().slice(i-1), sb=h.toLowerCase().slice(i-1);
    const V=/^.?(er|ez|ai|ais|ait|aient|a|as)$/;
    return (V.test(sa)||V.test(sb))&&!(/[sx]$/.test(sa)&&sa.slice(0,-1)===sb)&&!(/[sx]$/.test(sb)&&sb.slice(0,-1)===sa)?"conj":"accord";
  }
  return "ortho";
}
function dEval(refText,hyp,alts){
  const ops=dAlign(dtoks(refText),dtoks(hyp)); const errs=[]; let total=0;
  ops.forEach((o,k)=>{ const c=dClassify(o,alts); if(c){ o.c=c; total+=DCAT[c][1]; errs.push({k,c}); } else if(o.op==="sub") o.op="eq"; });
  return {ops,errs,total};
}
function dSep(p,t){ if(p==null) return ""; if(/^[.,)]$/.test(t)||t==="-"||p==="-"||/'$/.test(p)||p==="(") return ""; if(/^[:;!?»]$/.test(t)) return " "; if(p==="«") return " "; return " "; }
function dRender(ops){
  let out="",prev=null;
  ops.forEach(o=>{ const t=o.op==="ins"?o.h:o.r; out+=dSep(prev,t);
    if(o.op==="eq") out+=h(o.r);
    else if(o.op==="sub") out+=`<span class="rp"><s>${h(o.h)}</s><em>${h(o.r)}</em></span>`;
    else if(o.op==="del") out+=`<span class="rp"><em class="miss">${h(o.r)}</em></span>`;
    else out+=`<span class="rp"><s>${h(o.h)}</s></span>`;
    prev=t; });
  return out;
}
function dPlain(ops,side){ let out="",prev=null; ops.forEach(o=>{ const t=side==="h"?(o.op==="del"?null:(o.op==="eq"?o.r:o.h)):(o.op==="ins"?null:o.r); if(t==null) return; out+=dSep(prev,t)+t; prev=t; }); return out; }
function dContext(ops,k){ const w=ops.slice(Math.max(0,k-4),k+5); return {q:dPlain(w,"h"),a:dPlain(w,"r")}; }

const LS_KEY="carnet-remediation-v1";
const fresh=()=>({v:1,xp:0,lessons:{},carnet:{},mastered:{},days:{},writing:[],dictees:{},goal:20,updatedAt:0});
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let S=(()=>{try{const r=JSON.parse(lsGet(LS_KEY)||"null");return r&&r.v===1?Object.assign(fresh(),r):fresh()}catch(e){return fresh()}})();

const pad=n=>String(n).padStart(2,"0");
const dkey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function today(){const k=dkey();return S.days[k]||(S.days[k]={sec:0,xp:0,acts:[]})}
function addAct(a){const t=today(); if(!t.acts.includes(a)) t.acts.push(a)}
function addXP(n){S.xp+=n; today().xp+=n}

/* Sauvegarde : localStorage immédiat + db privé (data/users/<id>/progress) */
let remote={ref:null,writing:false,dirty:false,timer:null,ok:false};
function save(soon){
  S.updatedAt=Date.now();
  lsSet(LS_KEY,JSON.stringify(S));
  if(!remote.ref) return;
  clearTimeout(remote.timer);
  remote.timer=setTimeout(push, soon?300:6000);
}
async function push(){
  if(!remote.ref) return;
  if(remote.writing){remote.dirty=true;return}
  remote.writing=true;
  try{ await remote.ref.set({state:JSON.parse(JSON.stringify(S))}); remote.ok=true; }
  catch(e){ remote.ok=false; }
  finally{ remote.writing=false; renderStats(); if(remote.dirty){remote.dirty=false; push();} }
}
let sample=null, aiOff=false;
(async()=>{
  if(!window.claude||!window.claude.use) return;
  claude.use("sample").then(s=>{sample=s; if(view==="atelier"&&!P) render();});
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    remote.ref=db.doc("data/users/"+uid+"/progress");
    const snap=await remote.ref.get();
    const r=snap.exists?snap.data().state:null;
    if(r&&r.v===1&&(r.updatedAt||0)>(S.updatedAt||0)){
      S=Object.assign(fresh(),JSON.parse(JSON.stringify(r))); lsSet(LS_KEY,JSON.stringify(S)); remote.ok=true;
      if(!P) render();
    } else if(S.updatedAt>((r&&r.updatedAt)||0)) { await push(); }
    else remote.ok=true;
    renderStats();
    remote.ref.onSnapshot(sn=>{
      const d=sn.exists?sn.data().state:null;
      if(d&&d.v===1&&(d.updatedAt||0)>(S.updatedAt||0)&&!P){
        S=Object.assign(fresh(),JSON.parse(JSON.stringify(d))); lsSet(LS_KEY,JSON.stringify(S)); render();
      }
    },()=>{});
  }catch(e){ remote.ok=false; renderStats(); }
})();

/* Temps actif : compte quand une leçon ou l'atelier est ouvert, page visible, activité < 60 s */
let lastAct=Date.now();
["pointerdown","keydown","input"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
let tick=0;
setInterval(()=>{
  const studying=P||view==="atelier"||view==="dictee";
  if(!studying||document.visibilityState!=="visible"||Date.now()-lastAct>60000) return;
  today().sec++; if(P) P.sec++;
  if(++tick%20===0){ save(); if(!P) renderStats(); }
},1000);

function promptText(it){

function annotate(text,errs){
  const marks=[];
  errs.forEach((e,i)=>{ if(!e||!e.extrait) return; let from=0,idx;
    while((idx=text.indexOf(e.extrait,from))!==-1){ const end=idx+e.extrait.length;
      if(!marks.some(m=>idx<m.e&&end>m.s)){marks.push({s:idx,e:end,i});break} from=idx+1; } });
  marks.sort((a,b)=>a.s-b.s); let out="",p=0;
  marks.forEach(m=>{ out+=h(text.slice(p,m.s))+`<span class="rp"><s>${h(text.slice(m.s,m.e))}</s><em>${h(errs[m.i].correction)}</em><sup>${m.i+1}</sup></span>`; p=m.e; });
  return (out+h(text.slice(p))).replace(/\n/g,"<br>");
}

function dzExam(){
  const d=dz(), n=d.segs.length, full=d.segs.join(" ");
  const q=[{k:`d:${d.id}:full`,t:full,w:3000,msg:"Première lecture — écoutez sans écrire"}];
  d.segs.forEach((s,i)=>{ const k=`d:${d.id}:${DZ.punct?"p":"s"}${i}`;
    q.push({k,t:s,w:1500,i,msg:`Groupe ${i+1} / ${n} · première lecture`});
    q.push({k,t:s,w:Math.max(4000,words(s)*1800)/SPEED,i,msg:`Groupe ${i+1} / ${n} · deuxième lecture`}); });
  q.push({k:`d:${d.id}:full`,t:full,w:0,msg:"Relecture finale — vérifiez votre texte"});
  dzReset(); DZ.exam=true; DZ.i=-1; let idx=0;
  const run=()=>{ if(!DZ.exam) return; const s=q[idx++];
    if(!s){ DZ.exam=false; dzStatus("Dictée terminée. Relisez-vous, puis corrigez."); return; }
    if(s.i!=null) DZ.i=s.i; dzStatus(s.msg);
    playKey(s.k,s.t,false,()=>{ if(DZ.exam) dzLater(run,s.w); }); };
  const ta=$("#dtx"); if(ta) ta.focus();
  run();
}

let P=null;
function getItem(key){
  if(S.carnet[key]&&S.carnet[key].custom){ const c=S.carnet[key];
    return {k:"self",q:c.custom.q,a:c.custom.a,why:c.custom.why,t:c.t}; }
  return ITEMS[key]?ITEMS[key].it:null;
}
function openLesson(id){
  const l=LESSONS.find(x=>x.id===id); if(!l) return;
  if(l.special==="blanc"){
    const keys=shuffle(Object.keys(ITEMS).filter(k=>ITEMS[k].l.track===l.track)).slice(0,15);
    return start({mode:"blanc",title:l.title,eyebrow:"Défi · sans deuxième chance",lesson:l,steps:keys.map(k=>({kind:"item",key:k}))});
  }
  if(l.special==="mix"){
    const keys=shuffle(Object.keys(ITEMS).filter(k=>ITEMS[k].l.track==="acc")).slice(0,15);
    return start({mode:"lesson",title:l.title,eyebrow:"Accents et signes · Mélange",lesson:l,steps:keys.map(k=>({kind:"item",key:k}))});
  }
  if(l.track==="acc"){
    const keys=shuffle(l.items.map((_,i)=>l.id+":"+i)).slice(0,12);
    return start({mode:"lesson",title:l.title,eyebrow:"Accents et signes · "+l.title,lesson:l,steps:[{kind:"theory"}].concat(keys.map(k=>({kind:"item",key:k})))});
  }
  const steps=[{kind:"theory"}].concat(l.items.map((_,i)=>({kind:"item",key:l.id+":"+i})));
  start({mode:"lesson",title:l.title,eyebrow:`${l.sec} · ${l.unit} · ${l.project?"Projet":"Leçon "+l.n}`,lesson:l,steps});
}
function startReview(){
  const keys=Object.entries(S.carnet).sort((a,b)=>(a[1].s-b[1].s)||(a[1].at-b[1].at)).slice(0,10).map(([k])=>k).filter(getItem);
  if(!keys.length) return;
  start({mode:"review",title:"Révision du carnet",eyebrow:"Carnet · deux réussites de suite pour maîtriser",steps:shuffle(keys).map(k=>({kind:"item",key:k}))});
}
function start(o){

function prep(st,it){

  </div></div>
  <div class="pf"><div class="wrap"><div class="pfa">
    ${P.lesson&&P.lesson.project?`<button class="btn line" data-atelier="${AT[0]}">Ouvrir l'Atelier</button>`:`<button class="btn line" data-quit>Retour au parcours</button>`}
    ${nx&&(!P.lesson||nx.id!==P.lesson.id)?`<button class="btn" data-open="${nx.id}">Suivant · ${h(nx.title)}</button>`:""}
  </div></div></div>`;
  P.phase="end";
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.view) return go(d.view);
  if(d.go) return go(d.go);
  if(d.open){ if(P) closePlayer(); return openLesson(d.open); }
  if("review" in d) return startReview();
  if(d.dzgo){ DZ.mode=d.dzgo; lsSet("cr-dzmode",DZ.mode); return go("dictee"); }
  if(d.dzmode){ dzStop(); DZ.mode=d.dzmode; lsSet("cr-dzmode",DZ.mode); return render(); }
  if(d.dzpick){ dzStop(); DZ.id=d.dzpick; DZ.i=-1; DZ.res=null; DZ.ai=null; lsSet("cr-dz",DZ.id); render(); scrollTo(0,0); return; }
  if(d.speed){ setSpeed(+d.speed); if(view==="dictee") dzUI(); return; }
  if("speedcycle" in d){ setSpeed(SPEEDS[(SPEEDS.indexOf(SPEED)+SPEEDS.length-1)%SPEEDS.length]); toast("Vitesse "+fmtX(SPEED)); return; }
  if(d.dzlvl){ DZ.lvl=d.dzlvl; lsSet("cr-dzlvl",DZ.lvl); const ta=$("#dtx"); if(ta) dzSetDraft(ta.value); return render(); }
  if(d.dzset){ const [k,v]=d.dzset.split(":"); DZ[k]=v==="1"; lsSet("cr-dz-"+k,v);
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); dzUI(); return; }
  if(d.ins){ const ta=$("#dtx"); if(ta){ ta.setRangeText(d.ins,ta.selectionStart,ta.selectionEnd,"end"); ta.dispatchEvent(new Event("input",{bubbles:true})); ta.focus(); } return; }
  if(d.dz){ const a=d.dz, dd=dz();
    if(DZ.exam&&!["exam","check","toggle"].includes(a)) dzStop();
    if(a==="toggle") dzToggle();
    if(a==="full") dzFull();
    if(a==="next"){ if(DZ.i<dd.segs.length-1) dzSeg(DZ.i+1); else dzStatus("Dernier groupe atteint — relisez, puis écoutez la lecture intégrale."); }
    if(a==="prev"&&DZ.i>0) dzSeg(DZ.i-1);
    if(a==="rep") dzSeg(Math.max(0,DZ.i));
    if(a==="exam"){ if(DZ.exam){ dzStop(); dzStatus(); } else dzExam(); }
    if(a==="check") dzCheck();
    if(a==="clear"){ if(b.dataset.arm){ dzStop(); dzSetDraft(""); DZ.i=-1; DZ.res=null; render(); } else { b.dataset.arm="1"; b.textContent="Confirmer"; } }
    if(a==="again"){ dzStop(); dzSetDraft(""); DZ.i=-1; DZ.res=null; DZ.ai=null; render(); scrollTo(0,0); }
    if(a==="carnet") dzToCarnet();
    if(a==="ai") dzExplain();
    return; }
  if(d.track){ track=d.track; lsSet("cr-track",track); return render(); }
  if(d.task){ atelier.task=d.task; atelier.res=null; atelier.err=""; lsSet("cr-task",d.task); return render(); }
  if(b.id==="corr") return correct();
  if(b.id==="stop"){ if(atelier.ctl) atelier.ctl.abort(); return; }
  if(b.id==="tocarnet") return sendToCarnet();
  if("copy" in d){ const ta=$("#jtxt"); const txt=ta.value;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Journal copié")).catch(()=>{ta.focus();ta.select();toast("Texte sélectionné : copiez-le")}); return; }
  if(b.id==="reset"){ if(b.dataset.arm){ S=fresh(); save(true); toast("Progression réinitialisée"); render(); } else { b.dataset.arm="1"; b.innerHTML="<span>Confirmer : tout effacer ?</span><span>!</span>"; } return; }
  if(!P) return;
  if("quit" in d) return closePlayer();
  if(d.atelier){ atelier.task=d.atelier; atelier.sujet=1; atelier.res=null; lsSet("cr-task",d.atelier); closePlayer(); return go("atelier"); }
  if("read" in d){ const th=$("#theory"); if(!th) return;
    if(curKey==="t:"+P.lesson.id){ stopAudio(); b.innerHTML=SPK+" Écouter la leçon"; return; }
    if(playKey("t:"+P.lesson.id,th.innerText,false,()=>{ const r=document.querySelector("[data-read]"); if(r) r.innerHTML=SPK+" Écouter la leçon"; })){ b.innerHTML=SPK+" Arrêter la lecture"; }
    return; }
  if(d.say!=null) return speak(d.say, d.rate?+d.rate:0.95);
  if("next" in d) return next();
  if("check" in d) return check();
  if("skip" in d) return check(true);
  if(d.self!=null) return selfGrade(d.self==="1");
  if("why" in d) return askWhy(b);
  if(P.phase!=="answer") return;
  const st=P.steps[P.i]; const it=st&&st.kind==="item"?getItem(st.key):null; if(!it) return;
  if(d.opt!=null){ P.ans=+d.opt; return renderStep(); }
  if(d.chip!=null){ const i=+d.chip, ans=Object.assign({},P.ans||{});
    if(ans[i]!=null&&P.chip==null){ delete ans[i]; P.ans=ans; return renderStep(); }
    P.chip=P.chip===i?null:i; if(!P.ans) P.ans={}; return renderStep(); }
  if(d.bin!=null){ if(P.chip==null) return; const ans=Object.assign({},P.ans||{}); ans[P.chip]=+d.bin; P.ans=ans; P.chip=null; return renderStep(); }
  if(d.ml!=null){ const i=+d.ml, ans=Object.assign({},P.ans||{}); if(ans[i]!=null){ delete ans[i]; P.ans=ans; } P.ml=P.ml===i?null:i; if(!P.ans) P.ans={}; return renderStep(); }
  if(d.mr!=null){ if(P.ml==null) return; const j=+d.mr, ans=Object.assign({},P.ans||{}); for(const k in ans) if(ans[k]===j) delete ans[k]; ans[P.ml]=j; P.ans=ans; P.ml=null; return renderStep(); }
  if(d.tile!=null){ P.tile=+d.tile; if(!P.ans) P.ans={}; return renderStep(); }
  if(d.var!=null&&P.tile!=null){ P.ans=Object.assign({},P.ans,{[P.tile]:+d.var}); return renderStep(); }
  if(d.tok!=null){ P.ans=+d.tok; return renderStep(); }
  if(d.add!=null){ const a=P.ans||[]; if(!a.includes(+d.add)) P.ans=a.concat([+d.add]); return renderStep(); }
  if(d.rm!=null){ const a=(P.ans||[]).slice(); a.splice(+d.rm,1); P.ans=a; return renderStep(); }
});
document.addEventListener("input",e=>{
  if(e.target.id==="ans"&&P&&P.phase==="answer"){ P.ans=e.target.value; const sl=$("#qslot"); if(sl) sl.textContent=e.target.value; const c=document.querySelector("[data-check]"); if(c){ const it=getItem(P.steps[P.i].key); c.disabled=!ready(it); } }
});
document.addEventListener("change",e=>{
  if(e.target.id==="goal"){ S.goal=+e.target.value; save(true); render(); }
});
document.addEventListener("keydown",e=>{
  if(!P) return;
  if(e.key==="Escape") return closePlayer();
  const inTA=e.target.tagName==="TEXTAREA";
  if(e.key==="Enter"&&!inTA){ const b=$("#player").querySelector("[data-check]:not([disabled]),[data-next],[data-open]"); if(b){ e.preventDefault(); b.click(); } return; }
  if(P.phase==="answer"&&/^[1-4]$/.test(e.key)&&e.target.tagName!=="INPUT"&&!inTA){ const o=document.querySelectorAll("[data-opt]")[+e.key-1]; if(o) o.click(); }
});

render();
</script>
