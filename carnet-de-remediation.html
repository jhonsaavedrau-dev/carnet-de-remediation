<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de remédiation</title>
<meta name="description" content="Parcours de français B2→C1 construit à partir du diagnostic DELF B2 blanc de septembre 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Archivo:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F3F0E8; --raise:#FBF9F4; --ink:#111111; --stone:#6B655A; --faint:#8B8578;
  --line:#CFC7B6; --accent:#7C3B2E; --good:#2F7A4A; --good-bg:#E3EFE3;
  --bad:#B8322A; --bad-bg:#F5DCD6; --info:#1F6F78;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131210; --raise:#1B1A17; --ink:#F1EDE3; --stone:#A39B8B; --faint:#7F786B;
    --line:#38342C; --accent:#C9765F; --good:#79C68F; --good-bg:#1D2E22;
    --bad:#F07A6C; --bad-bg:#3A1F1B; --info:#6CC0C8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131210; --raise:#1B1A17; --ink:#F1EDE3; --stone:#A39B8B; --faint:#7F786B;
  --line:#38342C; --accent:#C9765F; --good:#79C68F; --good-bg:#1D2E22;
  --bad:#F07A6C; --bad-bg:#3A1F1B; --info:#6CC0C8; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.disp{font-family:var(--serif);font-weight:500;text-transform:uppercase;letter-spacing:.01em;line-height:1.02;text-wrap:balance;margin:0}
q{quotes:"« " " »"}
.rel{font-family:var(--serif);font-style:italic;color:var(--bad)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:58px}
.brand{font-family:var(--serif);font-weight:500;text-transform:uppercase;font-size:15px;letter-spacing:.08em;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;color:var(--stone);border-bottom:1px solid transparent}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.nav button:hover{color:var(--ink)}
.stats{margin-left:auto;display:flex;gap:18px;align-items:center;font-variant-numeric:tabular-nums}
.stats b{font-family:var(--serif);font-weight:500;font-size:18px;letter-spacing:0;text-transform:none;color:var(--ink);margin-right:5px}
.stats .mono{color:var(--stone);white-space:nowrap}
.sync{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.ok{background:var(--good)}
.tabbar{display:none}

/* ---------- home ---------- */
main{padding-block:40px 120px}
.home{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:clamp(32px,5vw,72px);align-items:start}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);display:grid;gap:36px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
.big{font-family:var(--serif);font-weight:500;font-size:clamp(64px,8vw,104px);line-height:.9;letter-spacing:-.02em;margin:12px 0 6px;font-variant-numeric:lining-nums}
.big span{font-size:.3em;letter-spacing:0;color:var(--stone);margin-left:6px}
.note{color:var(--stone);font-size:14px;margin:0;max-width:34ch}
.scores{display:grid;gap:14px;margin-top:22px}
.sc{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.sc .lab{font-size:14px}
.sc .val{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.sc .val.pri{color:var(--bad)}
.track{grid-column:1/-1;position:relative;height:4px;background:var(--line)}
.track i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.track i.pri{background:var(--bad)}
.track .tick{position:absolute;top:-5px;bottom:-5px;width:1px;background:var(--accent);left:60%}
.axis{display:flex;justify-content:space-between;position:relative;font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.06em;margin-top:4px}
.axis span:nth-child(2){position:absolute;left:60%;transform:translateX(-50%);color:var(--accent)}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.today{display:grid;gap:12px}
.goal{display:flex;justify-content:space-between;align-items:baseline}
.goal b{font-family:var(--serif);font-weight:500;font-size:28px;font-variant-numeric:tabular-nums}
.goal .mono{color:var(--stone)}
.gbar{height:4px;background:var(--line);position:relative}
.gbar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;gap:4px;justify-items:center;font-family:var(--mono);font-size:10px;color:var(--stone)}
.wd i{width:100%;aspect-ratio:1;max-width:36px;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--stone)}
.wd i.part{border-color:var(--ink)}
.wd i.full{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.wd.now{color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;background:var(--ink);color:var(--paper);padding:16px 18px;transition:background .15s}
.cta:hover{background:var(--accent)}
.cta small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.cta b{font-weight:500}
.cta .arr{font-family:var(--serif);font-size:24px}
.ghost{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--ink);padding:13px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.ghost:hover{background:var(--ink);color:var(--paper)}
.ghost[disabled]{opacity:.4;cursor:default;background:none;color:var(--ink)}

.lead{display:grid;gap:18px;margin-bottom:56px}
.lead h1{font-size:clamp(38px,6vw,72px)}
.lead p{margin:0;max-width:58ch;color:var(--stone)}
.sec{border-top:1px solid var(--ink);padding-top:22px;margin-bottom:64px}
.sech{display:grid;grid-template-columns:auto 1fr;gap:0 22px;align-items:start;margin-bottom:28px}
.secn{font-family:var(--serif);font-weight:400;font-style:italic;font-size:56px;line-height:.9;color:var(--accent);min-width:1.1em}
.sech h2{font-size:clamp(26px,3.6vw,38px)}
.sech p{margin:8px 0 0;color:var(--stone);font-size:15px}
.sech .meta{margin-top:10px;color:var(--stone)}
.sbar{grid-column:2;height:1px;background:var(--line);position:relative;margin-top:14px}
.sbar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink)}
.unit{margin:0 0 26px}
.unit h3{margin:0 0 6px;color:var(--stone);font-weight:400}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.rows li:first-child .row{border-top:1px solid var(--line)}
.row:hover .rt b{color:var(--accent)}
.rn{font-family:var(--mono);font-size:12px;color:var(--stone);font-variant-numeric:tabular-nums}
.rt{display:grid;gap:2px;min-width:0}
.rt b{font-weight:500;font-size:17px;transition:color .15s}
.rt small{color:var(--stone)}
.rt .rel{font-size:14px}
.rs{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);text-align:right;white-space:nowrap}
.rs.done{color:var(--good)}
.rs.next{color:var(--accent)}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;padding:1px 6px;margin-right:6px;color:var(--accent)}

/* ---------- generic views ---------- */
.vh{display:grid;gap:12px;margin-bottom:40px;max-width:760px}
.vh h1{font-size:clamp(34px,5vw,60px)}
.vh p{margin:0;color:var(--stone)}
.cols{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,64px);align-items:start}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);font-weight:400;text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--ink)}
.tbl td{padding:12px 8px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.n{text-align:right}
.scroll{overflow-x:auto}
.dchip{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--bad);margin-left:6px;white-space:nowrap}
.mini{height:3px;background:var(--line);position:relative;margin-top:6px;max-width:220px}
.mini i{position:absolute;inset:0 auto 0 0;background:var(--bad)}
.mini i.g{background:var(--good)}
.empty{border:1px solid var(--line);padding:22px;color:var(--stone);max-width:60ch}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;display:grid;gap:2px}
.list li small{color:var(--stone)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.kv div{background:var(--paper);padding:14px}
.kv b{display:block;font-family:var(--serif);font-weight:500;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.kv span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
textarea,select,input[type="text"]{font:inherit;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:0;width:100%}
textarea{padding:14px;min-height:280px;line-height:1.6;resize:vertical}
select{padding:10px}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--ink)}
.seg button{flex:1 1 auto;padding:10px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-right:1px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.consigne{border-left:1px solid var(--accent);padding:4px 0 4px 16px;font-family:var(--serif);font-size:18px;line-height:1.5}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--paper);padding:13px 20px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.btn:hover{background:var(--accent)}
.btn[disabled]{opacity:.35;cursor:default;background:var(--ink)}
.btn.line{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--paper)}
.stack{display:grid;gap:18px}
.annot{background:var(--raise);border:1px solid var(--line);padding:20px;font-size:16px;line-height:1.9;white-space:normal;overflow-wrap:anywhere}
.rp s{text-decoration-color:var(--bad);text-decoration-thickness:1.5px;color:var(--stone)}
.rp em{font-family:var(--serif);font-style:italic;color:var(--bad);margin-left:4px}
.rp sup{font-family:var(--mono);font-size:9px;color:var(--bad);margin-left:1px}
.errs{list-style:none;margin:0;padding:0;counter-reset:e}
.errs li{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.errs li::before{counter-increment:e;content:counter(e);font-family:var(--mono);font-size:11px;color:var(--bad);padding-top:3px}
.errs .fx s{color:var(--stone)}
.errs .fx em{font-family:var(--serif);font-style:italic;color:var(--bad)}
.errs small{grid-column:2;color:var(--stone)}
.grid5{display:grid;gap:8px}
.g5{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;font-size:14px}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:12px;border:1px solid var(--ink)}
.pips i.on{background:var(--ink)}
.muted{color:var(--stone)}
.small{font-size:13px}
.ai-out{white-space:pre-wrap}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ph{border-bottom:1px solid var(--line)}
.ph .wrap{display:flex;align-items:center;gap:18px;height:56px}
.quit{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
.quit:hover{color:var(--ink)}
.pbar{flex:1;height:2px;background:var(--line);position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .3s}
.pcount{font-family:var(--mono);font-size:11px;color:var(--stone);font-variant-numeric:tabular-nums}
.pbody{flex:1;overflow-y:auto}
.pbody .wrap{max-width:720px;padding-block:36px 40px}
.pbody h2{font-size:clamp(28px,4.4vw,44px);margin:10px 0 22px}
.q{font-size:20px;line-height:1.5;margin:10px 0 24px;text-wrap:pretty}
.blank{display:inline-block;min-width:70px;border-bottom:1.5px solid var(--ink);margin:0 4px;height:1.1em;vertical-align:baseline}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;border:1px solid var(--line);background:var(--raise);padding:14px 16px;font-size:17px;transition:border-color .12s}
.opt:hover{border-color:var(--ink)}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--stone);border:1px solid var(--line);width:24px;height:24px;display:grid;place-items:center}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg);box-shadow:none}
.opt.ok .k{background:var(--good);border-color:var(--good);color:var(--paper)}
.opt.ko{border-color:var(--bad);background:var(--bad-bg);box-shadow:none}
.opt.ko .k{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt[disabled]{cursor:default}
.fill{font-size:20px;padding:14px 16px}
.toks{display:flex;flex-wrap:wrap;gap:8px 6px;font-size:20px;line-height:1.4}
.tok{padding:4px 8px;border:1px solid var(--line);background:var(--raise)}
.tok:hover{border-color:var(--ink)}
.tok[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tok.ko{background:var(--bad-bg);border-color:var(--bad)}
.tok.ok{background:var(--good-bg);border-color:var(--good)}
.punct{padding:4px 0;margin-left:-4px}
.fixline{margin-top:18px;font-size:19px;line-height:1.6}
.answer{min-height:64px;border-bottom:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:22px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ink);background:var(--raise);padding:8px 12px;font-size:17px}
.chip.used{opacity:.25;pointer-events:none}
.listen{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 22px}
.say{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--ink);padding:12px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.say:hover{background:var(--ink);color:var(--paper)}
.say svg{width:16px;height:16px}
.theory{font-size:17px;line-height:1.65}
.theory p{margin:0 0 14px;max-width:64ch}
.theory table{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0 18px}
.theory th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;color:var(--stone);text-align:left;border-bottom:1px solid var(--ink);padding:6px 10px 6px 0}
.theory td{border-bottom:1px solid var(--line);padding:9px 10px 9px 0;vertical-align:top}
.theory .tw{overflow-x:auto;margin-bottom:6px}
.theory ul{padding-left:18px;margin:0 0 14px}
.theory li{margin-bottom:4px}
.theory .relv{border-left:1px solid var(--bad);padding-left:14px;margin-bottom:18px}
.pf{border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.pf.good{background:var(--good-bg);border-top-color:var(--good)}
.pf.bad{background:var(--bad-bg);border-top-color:var(--bad)}
.pf .wrap{max-width:720px;display:grid;gap:12px;padding-block:16px}
.fb h4{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:24px}
.pf.good .fb h4{color:var(--good)}
.pf.bad .fb h4{color:var(--bad)}
.fb p{margin:4px 0 0;font-size:15px}
.fb .exp{font-weight:500}
.pfa{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.pfa .btn{min-width:180px}
.why{font-size:14px;border-top:1px solid currentColor;padding-top:10px;margin-top:6px;opacity:.95}
.linkish{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.end{display:grid;gap:26px}
.end .big{font-size:clamp(80px,14vw,140px)}

/* ---------- dictée & signes ---------- */
.dzctl{display:flex;flex-wrap:wrap;gap:8px}
.deck{border:1px solid var(--ink);background:var(--raise)}
.deck-top{display:flex;align-items:center;gap:18px;padding:16px;flex-wrap:wrap}
.transport{display:flex;gap:6px;align-items:center}
.tbtn{width:46px;height:46px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.tbtn:hover{border-color:var(--ink)}
.tbtn svg{width:16px;height:16px}
.tbtn.main{width:60px;height:60px;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tbtn.main:hover{background:var(--accent);border-color:var(--accent)}
.tbtn.main svg{width:20px;height:20px}
.deck-info{flex:1 1 180px;display:grid;gap:10px;min-width:0}
.deck-row{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
.deck-row .btn{padding:11px 14px}
.deck-set{border-top:1px solid var(--line)}
.deck-set summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px}
.deck-set summary::-webkit-details-marker{display:none}
.deck-set summary::before{content:"+";font-family:var(--mono);margin-right:8px}
.deck-set[open] summary::before{content:"−"}
.deck-set summary .mono:first-of-type{flex:1}
.setrow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 14px;align-items:center;padding:0 16px 14px}
.setrow .seg button{padding:9px 10px}
@media (max-width:560px){ .setrow{grid-template-columns:minmax(0,1fr)} .deck-top{gap:14px} }
.dzctl .btn,.dzctl .btn.line{padding:11px 14px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:16px;height:4px;background:var(--line)}
.dots i.done{background:var(--ink)}
.dots i.cur{background:var(--accent)}
.kbar{display:flex;flex-wrap:wrap;gap:4px}
.kbar button{font-family:var(--serif);font-size:18px;min-width:38px;height:38px;border:1px solid var(--line);background:var(--raise)}
.kbar button:hover{border-color:var(--ink)}
#dtx{min-height:240px;font-size:18px;font-family:var(--serif);line-height:1.8}
.rp em.miss{text-decoration:underline dotted var(--bad);text-underline-offset:3px}
.dzstat{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);min-height:16px}

    { id:"cond", title:"Conditionnel et hypothèse", t:"conj",
      theory:`<p><b>Formation :</b> radical du futur + terminaisons de l'imparfait : je voudr<i>ais</i>, nous aimer<i>ions</i>, vous pourr<i>iez</i>.</p>
      <ul><li><b>Politesse :</b> Pourriez-vous m'indiquer… ? Nous souhaiterions…</li>
      <li><b>Conseil :</b> Il vaudrait mieux…</li>
      <li><b>Information non confirmée :</b> Selon les organisateurs, la course attirerait 20 000 visiteurs.</li></ul>
      <div class="tw"><table><tr><th>Si +</th><th>Résultat</th></tr>
      <tr><td>présent</td><td>futur — Si la mairie écoute, elle évitera le conflit.</td></tr>
      <tr><td>imparfait</td><td>conditionnel — Si la mairie écoutait, elle éviterait le conflit.</td></tr>
      <tr><td>plus-que-parfait</td><td>conditionnel passé — Si j'avais su, je serais venu.</td></tr></table></div>
      <p><b>Règle d'or :</b> jamais de conditionnel juste après <i>si</i>.</p>`,
      items:[
        C("Si la mairie ___ les habitants, elle éviterait ce conflit.",["consulterait","consultait","consulte"],1,"Si + imparfait → conditionnel."),
        F("___ -vous m'indiquer la date de la réunion ? (pouvoir, politesse)",["pourriez"],"Conditionnel de politesse : pourriez-vous."),
        C("Si j'avais su, je ___ plus tôt.",["serais venu","venais","viendrais"],0,"Si + plus-que-parfait → conditionnel passé."),
        SP("Si [j'aurais] plus de temps , je lirais la presse chaque jour .","j'avais","Jamais de conditionnel après si : si j'avais."),
        F("Nous ___ connaître les mesures prévues. (souhaiter)",["souhaiterions"],"Conditionnel de politesse : nous souhaiterions."),
        C("Selon les organisateurs, la course ___ 20 000 visiteurs.",["attirera","attirerait","attire"],1,"Information non confirmée : conditionnel journalistique.")
      ]}
  ]}
]},
{ id:"II", title:"Production écrite", sub:"10/25 au diagnostic : la priorité n° 1 du semestre. Huit types d'erreurs relevés sur la lettre à la mairie.",
  units:[
  { title:"La lettre formelle", lessons:[
    { id:"consigne", title:"Répondre à la consigne", t:"consigne", rel:"« adéquation de la réponse à la consigne »",
      theory:`<p>Le format était bon, mais la correctrice a noté <span class="rel">« adéquation de la réponse à la consigne »</span>. Avant d'écrire une seule phrase, soulignez quatre choses :</p>
      <ul><li><b>Le destinataire</b> — qui lit ? (le maire, un journal, un ami)</li>
      <li><b>Les tâches</b> — souvent deux : exprimer un désaccord <i>et</i> proposer une solution</li>
      <li><b>Le registre</b> — soutenu, vouvoiement</li>
      <li><b>La longueur</b> — 250 mots minimum au DELF B2</li></ul>
      <p class="consigne">Le conseil municipal de votre ville projette d'organiser une course automobile en centre-ville. Vous écrivez une lettre au maire pour exprimer votre désaccord et proposer une solution de remplacement. (250 mots minimum)</p>`,
      items:[
        C("Dans cette consigne, quel est le destinataire ?",["Le maire","Un ami","Le journal local"],0,"La lettre s'adresse au maire : registre soutenu."),
        C("Que devez-vous faire en plus d'exprimer votre désaccord ?",["Proposer une solution de remplacement","Raconter une course","Décrire votre quartier"],0,"Oublier la deuxième tâche coûte directement des points."),
        C("Quel registre est attendu ?",["Soutenu, vouvoiement","Familier, tutoiement","Neutre, tutoiement"],0,"On écrit à une autorité : soutenu et vouvoiement."),
        C("Quelle est la longueur minimale au DELF B2 ?",["250 mots","120 mots","500 mots"],0,"250 mots minimum en production écrite B2."),
        C("Un texte de 180 mots au DELF B2…",["est pénalisé : il ne respecte pas la consigne","est accepté s'il est bien écrit","obtient un bonus de concision"],0,"La longueur fait partie de la consigne."),
        C("Quelle partie est la plus souvent oubliée ?",["La proposition concrète demandée","La date","L'objet"],0,"Relisez la consigne à la fin : toutes les tâches sont-elles traitées ?")
      ]},
    { id:"lettre", title:"Formules de la lettre", t:"polit", rel:"« formules de politesse »",
      theory:`<p><b>Structure :</b> expéditeur (en haut à gauche) · destinataire · lieu et date (<i>Pamplona, le 18 septembre 2026</i>) · <b>Objet :</b> · formule d'appel · corps · formule finale · signature.</p>
      <div class="tw"><table><tr><th>Moment</th><th>Formule</th></tr>
      <tr><td>Appel</td><td>Madame la Maire, · Monsieur le Maire, · Madame, Monsieur,</td></tr>
      <tr><td>Introduction</td><td>Je me permets de vous écrire afin de vous faire part de…</td></tr>
      <tr><td>Proposition</td><td>Je me permets de vous suggérer…</td></tr>
      <tr><td>Avant la fin</td><td>Dans l'attente de votre réponse,</td></tr>
      <tr><td>Formule finale</td><td>je vous prie d'agréer, Monsieur le Maire, l'expression de mes salutations distinguées.</td></tr></table></div>
      <p><b>La formule finale reprend la formule d'appel.</b> Pas de « Cordialement » (courriel), ni de « Bonjour », ni de point d'exclamation.</p>`,
      items:[
        C("Formule d'appel pour écrire à la maire de la ville :",["Madame la Maire,","Chère Madame,","Bonjour Madame la Maire !"],0,"Titre officiel + virgule : Madame la Maire,"),
        O(["Je vous prie d'agréer,","Madame la Maire,","l'expression","de mes salutations","distinguées."],"La formule finale reprend l'appel (Madame la Maire)."),
        C("Quelle formule n'a pas sa place dans cette lettre ?",["Merci d'avance, à plus !","Je me permets de vous écrire afin de…","Dans l'attente de votre réponse,"],0,"Trop familière pour une lettre officielle."),
        F("___ : Opposition à la course automobile en centre-ville",["objet"],"La ligne <i>Objet :</i> annonce le sujet de la lettre."),
        C("Où place-t-on « Pamplona, le 18 septembre 2026 » ?",["En haut à droite, avant l'objet","Sous la signature","Dans la formule d'appel"],0,"Lieu et date : en haut à droite."),
        O(["Je me permets","de vous écrire","afin de vous faire part","de mon opposition","au projet de course automobile."],"Introduction type d'une lettre formelle."),
        C("La formule finale doit…",["reprendre la formule d'appel","utiliser le tutoiement","se terminer par un point d'exclamation"],0,"Madame la Maire, … je vous prie d'agréer, Madame la Maire, …")
      ]},
    { id:"registre", title:"Le registre soutenu", t:"registre",
      theory:`<p>La lettre est lue par une autorité : chaque mot familier fait baisser la note de lexique.</p>
      <div class="tw"><table><tr><th>Familier</th><th>Soutenu</th></tr>
      <tr><td>ça</td><td>cela</td></tr>
      <tr><td>on</td><td>nous</td></tr>
      <tr><td>les gens</td><td>les habitants, les citoyens, les riverains</td></tr>
      <tr><td>super, trop</td><td>très, extrêmement, particulièrement</td></tr>
      <tr><td>plein de</td><td>de nombreux, beaucoup de</td></tr>
      <tr><td>boulot</td><td>travail, emploi</td></tr>
      <tr><td>je trouve pas</td><td>je ne trouve pas (le <i>ne</i> est obligatoire à l'écrit)</td></tr></table></div>`,
      items:[
        SP("Ce projet est [super] dangereux pour les habitants .","extrêmement","<i>Super</i> est familier : extrêmement, particulièrement."),
        SP("[Ça] va causer beaucoup de bruit dans le quartier .","Cela","À l'écrit soutenu : cela."),
        C("Version soutenue de « On veut pas de cette course. »",["Nous ne souhaitons pas que cette course ait lieu.","On veut pas cette course.","Nous voulons pas de cette course."],0,"<i>Nous</i>, négation complète, verbe plus précis."),
        C("Laquelle respecte la négation écrite ?",["Je ne trouve pas cette décision raisonnable.","Je trouve pas cette décision raisonnable."],0,"À l'écrit, le <i>ne</i> est obligatoire."),
        F("Beaucoup d'habitants se rendent à leur ___ en voiture. (remplacez « boulot »)",["travail"],"<i>Boulot</i> est familier : travail."),
        C("Remplacez « Il y a plein de problèmes. »",["De nombreux problèmes se posent.","Il y a un tas de problèmes.","Il y a trop de problèmes, quoi."],0,"<i>De nombreux</i> + verbe précis.")
      ]}
  ]},
  { title:"Cohérence", lessons:[
    { id:"conn", title:"Les connecteurs logiques", t:"coh",
      theory:`<p>Les connecteurs rendent l'argumentation lisible pour la correctrice. Variez-les.</p>
      <div class="tw"><table><tr><th>Fonction</th><th>Connecteurs</th></tr>
      <tr><td>Ajouter</td><td>de plus, en outre, par ailleurs</td></tr>
      <tr><td>Opposer</td><td>cependant, néanmoins, en revanche, alors que</td></tr>
      <tr><td>Concéder</td><td>certes… mais, bien que (+ subj.), il n'en demeure pas moins que</td></tr>
      <tr><td>Cause</td><td>en effet, puisque, étant donné que</td></tr>
      <tr><td>Conséquence</td><td>par conséquent, c'est pourquoi, si bien que</td></tr>
      <tr><td>Conclure</td><td>en définitive, en somme, pour conclure</td></tr></table></div>`,
      items:[
        C("La course attirerait des touristes. ___, elle provoquerait d'importantes nuisances.",["Cependant","Par conséquent","De plus"],0,"Opposition entre un avantage et un inconvénient."),
        C("Les rues seraient fermées pendant trois jours ; ___, les commerçants perdraient des clients.",["par conséquent","néanmoins","en revanche"],0,"Conséquence."),
        C("___ ce projet soit ambitieux, il ne répond pas aux besoins des habitants.",["Bien que","Puisque","Même si"],0,"Bien que + subjonctif (soit). Même si serait suivi de l'indicatif."),
        C("Le bruit est un problème. ___, la pollution de l'air augmenterait.",["En outre","Pourtant","Donc"],0,"On ajoute un argument : en outre."),
        C("___, ce projet présente plus d'inconvénients que d'avantages.",["En définitive","Tout d'abord","D'une part"],0,"Connecteur de conclusion."),
        F("Certes, la course est populaire, ___ elle coûte cher à la ville.",["mais"],"Certes… mais : concession."),
        O(["Il n'en demeure pas moins que","la sécurité des habitants","doit rester","la priorité."],"Concession soutenue, très appréciée au B2–C1.")
      ]},
    { id:"rep", title:"Éviter les répétitions", t:"rep", rel:"« À mon avis, je crois »",
      theory:`<div class="relv"><p>Relevé à l'oral : <span class="rel">« À mon avis, je crois »</span> — deux marques d'opinion pour une seule idée.</p></div>
      <p><b>Pronoms :</b> le / la / les (COD) · lui / leur (à + personne) · <b>en</b> (de + chose) · <b>y</b> (à + chose).</p>
      <div class="tw"><table><tr><th>Mot usé</th><th>Plus précis</th></tr>
      <tr><td>dire</td><td>affirmer, souligner, indiquer, rappeler</td></tr>
      <tr><td>problème</td><td>difficulté, enjeu, inconvénient</td></tr>
      <tr><td>faire</td><td>organiser, réaliser, mener</td></tr>
      <tr><td>chose</td><td>élément, aspect, phénomène</td></tr>
      <tr><td>montrer</td><td>révéler, mettre en évidence</td></tr></table></div>`,
      items:[
        C("La mairie a présenté le projet. Les habitants ont critiqué le projet. → reprise :",["Les habitants l'ont critiqué.","Les habitants ont critiqué lui.","Les habitants y ont critiqué."],0,"COD placé avant le verbe : l'."),
        C("Des solutions ? Je ___ propose trois.",["en","les","y"],0,"<i>En</i> reprend un nom avec une quantité."),
        C("Pensez-vous à la sécurité ? — Oui, j'___ pense.",["y","en","le"],0,"penser à quelque chose → y."),
        C("« Le document <u>dit</u> que 69 % des salariés sont heureux. » Meilleur verbe :",["indique","raconte","parle"],0,"Un document indique, souligne, révèle."),
        C("« Ce ___ inquiète les habitants. » (au lieu de « cette chose »)",["phénomène","truc","chose-là"],0,"Un nom précis au lieu de <i>chose</i>."),
        SP("[À] [mon] [avis] , [je] [crois] que le télétravail est utile .","À mon avis, le télétravail… — ou — Je crois que le télétravail…","Une seule marque d'opinion suffit."),
        C("« La mairie veut <u>faire</u> une course. » Meilleur verbe :",["organiser","effectuer","exécuter"],0,"On organise un événement.")
      ]}
  ]},
  { title:"Orthographe et ponctuation", lessons:[
    { id:"ortho", title:"Orthographe", t:"ortho", rel:"« enterprises »",
      theory:`<div class="relv"><p>Relevé : <span class="rel">« enterprises »</span> → <b>entreprises</b>. L'anglais et l'espagnol s'invitent dans l'orthographe.</p></div>
      <p><b>Mots piégés :</b> entreprise · adresse · développement · exemple · environnement · gouvernement · langage · responsabilité · appartement.</p>
      <div class="tw"><table><tr><th>Homophones</th><th>Astuce</th></tr>
      <tr><td>a / à</td><td><i>a</i> = avait possible (verbe) ; sinon <i>à</i></td></tr>
      <tr><td>ou / où</td><td><i>ou</i> = ou bien ; <i>où</i> = lieu ou temps</td></tr>
      <tr><td>leur / leurs</td><td><i>leur</i> devant un nom singulier ou devant un verbe</td></tr>
      <tr><td>s'est / c'est / ses / ces</td><td><i>s'est</i> = verbe pronominal ; <i>c'est</i> = cela est</td></tr>
      <tr><td>-er / -é</td><td>remplacez par <i>prendre / pris</i></td></tr></table></div>`,
      items:[
        C("Quelle orthographe est correcte ?",["entreprise","enterprise","entreprize"],0,"En-tre-prise, comme « prendre »."),
        C("Quelle orthographe est correcte ?",["développement","dévelopement","development"],0,"Deux p, et -ement."),
        C("Quelle orthographe est correcte ?",["adresse","adress","address"],0,"Un d, deux s, un e final."),
        F("La ville ___ décidé d'organiser une course. (a / à)",["a"],"On peut dire « avait décidé » : c'est le verbe avoir."),
        F("Je m'adresse ___ vous en tant qu'habitant. (a / à)",["à"],"Préposition : à, avec accent."),
        C("Le quartier ___ j'habite est calme.",["où","ou"],0,"Lieu : où."),
        C("Les habitants défendent ___ quartier.",["leur","leurs"],0,"Un seul quartier pour eux tous : leur."),
        C("Il faut ___ les horaires.",["changer","changé","changez"],0,"Il faut <i>prendre</i> → infinitif."),
        C("Elle ___ trompée de date.",["s'est","c'est","ses"],0,"Verbe pronominal se tromper : s'est."),
        C("Quelle orthographe est correcte ?",["environnement","environement","enviroment"],0,"Deux n au milieu : environnement.")
      ]},
    { id:"ponct", title:"Ponctuation française", t:"ponct",
      theory:`<ul><li><b>Espace avant</b> : ; ? ! et à l'intérieur des guillemets « … ». Pas d'espace avant la virgule ni le point.</li>
      <li><b>Pas de virgule</b> entre le sujet et le verbe.</li>
      <li><b>Virgule après</b> un connecteur en début de phrase : Cependant, …</li>
      <li><b>Minuscules</b> pour les jours, les mois et les langues : lundi, septembre, le français. Majuscule pour les habitants : les Français.</li>
      <li><b>Guillemets français</b> « … » plutôt que "…".</li></ul>`,
      items:[
        C("Quelle phrase respecte la typographie française ?",["Pourquoi organiser cette course\u00a0?","Pourquoi organiser cette course?"],0,"Espace avant le point d'interrogation."),
        C("Quelle phrase est correcte ?",["Le mercredi 3 septembre, j'ai passé l'examen.","Le Mercredi 3 Septembre, j'ai passé l'examen."],0,"Jours et mois en minuscules."),
        C("Quelle phrase est correcte ?",["J'étudie le français depuis 2022.","J'étudie le Français depuis 2022."],0,"La langue prend une minuscule."),
        C("Quelle phrase est correcte ?",["Les habitants du centre-ville s'opposent au projet.","Les habitants du centre-ville, s'opposent au projet."],0,"Jamais de virgule entre le sujet et le verbe."),
        C("Quelle phrase est correcte ?",["Cependant, la sécurité reste un problème.","Cependant la sécurité, reste un problème."],0,"Virgule après le connecteur, pas avant le verbe."),
        C("Quelle phrase est correcte ?",["Le maire parle d'«\u00a0une fête populaire\u00a0».","Le maire parle d'\"une fête populaire\"."],0,"Guillemets français avec espaces intérieures.")
      ]}
  ]},
  { title:"Projet", lessons:[
    { id:"p-lettre", project:true, title:"Réécrire la lettre à la mairie", t:"polit",
      theory:`<p><b>Projet.</b> Même sujet que le diagnostic du 3 septembre : une course automobile en centre-ville. Vous reprenez la lettre étape par étape, en corrigeant les huit types d'erreurs relevés. <i>Les phrases ci-dessous sont des phrases d'entraînement, pas votre copie.</i></p>
      <p class="consigne">Le conseil municipal projette d'organiser une course automobile en centre-ville. Écrivez au maire pour exprimer votre désaccord et proposer une solution de remplacement. (250 mots minimum)</p>
      <p>À la fin, rédigez la lettre complète dans l'<b>Atelier</b> : Claude la corrige avec la même grille.</p>`,
      items:[
        C("Quelle ligne d'objet convient ?",["Objet : Opposition au projet de course automobile en centre-ville","Objet : Salut, je suis pas d'accord","Objet : Course !!!"],0,"Objet court, précis, neutre.",{t:"polit"}),
        SP("Je m'oppose [a] ce projet pour plusieurs raisons .","à","s'opposer à — préposition avec accent.",{t:"prep"}),
        SP("Cette course va causer des nuisances [importants] .","importantes","<i>Nuisances</i> est féminin pluriel.",{t:"accord"}),
        SP("Les [enterprises] du centre-ville devraient fermer .","entreprises","Anglicisme : entreprises.",{t:"ortho"}),
        SP("Les [habitants,] sont inquiets pour leur sécurité .","habitants (sans virgule)","Pas de virgule entre le sujet et le verbe.",{t:"ponct"}),
        C("Pour introduire votre solution de remplacement :",["Je me permets de vous suggérer une autre solution : organiser la course sur le circuit régional.","Moi je dis qu'il faut faire ça ailleurs.","Faites plutôt ça sur un circuit !"],0,"Tâche 2 de la consigne, dans le bon registre.",{t:"consigne"}),
        C("Pour éviter de répéter « course » :",["cette compétition","cette course-là","la course de la course"],0,"Un synonyme précis évite la répétition.",{t:"rep"}),
        F("Dans l'attente de votre ___, je vous prie d'agréer…",["réponse"],"Formule d'attente classique.",{t:"polit"}),
        O(["Je vous prie d'agréer,","Monsieur le Maire,","l'expression","de mes salutations","distinguées."],"La formule finale reprend l'appel.",{t:"polit"})
      ]}
  ]}
]},
{ id:"III", title:"Oral et écoute", sub:"« Pas de conclusion. » en rouge sur la grille, et 12,5/25 en compréhension orale : les chiffres et les dates s'échappent.",
  units:[
  { title:"L'exposé", lessons:[
    { id:"plan", title:"Le plan de l'exposé", t:"struct",
      theory:`<p>L'évaluatrice a jugé votre plan clair. Il manquait une seule chose : la fin.</p>
      <div class="tw"><table><tr><th>Étape</th><th>Formule</th></tr>
      <tr><td>1. Présenter le document</td><td>Le document soumis à notre réflexion aborde…</td></tr>
      <tr><td>2. Problématique</td><td>La question est donc de savoir si…</td></tr>
      <tr><td>3. Analyse</td><td>Il ressort de ce document que… · D'après les chiffres…</td></tr>
      <tr><td>4. Comparaison</td><td>En Colombie, en revanche, …</td></tr>
      <tr><td>5. Avis</td><td>Pour ma part, j'estime que…</td></tr>
      <tr><td>6. Conclusion</td><td>En définitive, … Reste à savoir si…</td></tr></table></div>
      <p><b>Votre propre solution, notée dans le portfolio :</b> écrire la phrase de conclusion pendant les dix minutes de préparation, <i>avant</i> le développement.</p>`,
      items:[
        O(["Présenter le document","Poser la problématique","Analyser les chiffres","Comparer avec la Colombie","Donner mon avis","Conclure"],"Le plan complet — la conclusion en dernier, toujours.",{q:"Remettez les étapes de l'exposé dans l'ordre."}),
        C("Quelle phrase pose la problématique ?",["La question est donc de savoir si le travail peut rendre heureux.","J'ai tiré le sujet numéro 2.","Voilà, c'est le document."],0,"La problématique est une question claire."),
        C("Pour comparer avec votre pays :",["En Colombie, en revanche, …","A Colombie, c'est pareil.","Chez moi c'est différent, quoi."],0,"en Colombie + connecteur d'opposition."),
        C("Pour donner son avis sans redondance :",["Pour ma part, j'estime que…","À mon avis, je pense que…","Moi, personnellement, à mon avis…"],0,"Une seule marque d'opinion."),
        C("Que doit contenir la conclusion ?",["Une synthèse, une réponse à la problématique et une ouverture","Un argument nouveau","Seulement un remerciement"],0,"Synthèse, réponse, ouverture."),
        C("Quand rédiger la conclusion pendant la préparation ?",["Avant le développement, pour ne jamais l'oublier","À la fin, s'il reste du temps","Jamais : on improvise"],0,"C'est la solution notée dans votre journal du 5 septembre.")
      ]},
    { id:"concl", title:"Toujours conclure", t:"struct", rel:"« Pas de conclusion. »",
      theory:`<div class="relv"><p>Sur la grille, en rouge : <span class="rel">« Pas de conclusion. »</span></p></div>
      <p><b>Trois temps, trois à cinq phrases :</b></p>
      <ul><li><b>Annoncer :</b> En définitive, · En somme, · Au terme de cette analyse,</li>
      <li><b>Répondre</b> à la problématique, de façon nuancée</li>
      <li><b>Ouvrir :</b> Reste à savoir si… · On peut dès lors se demander si…</li></ul>
      <p><i>Exemple (sujet n° 2) :</i> « En définitive, le bonheur au travail existe bel et bien, mais il est fragile et dépend de la capacité des entreprises à préserver la qualité des relations humaines. »</p>`,
      items:[
        O(["En définitive,","le bonheur au travail","existe bel et bien,","mais il reste fragile."],"Annonce + réponse nuancée."),
        C("Meilleure conclusion pour « Peut-on vivre sans télé ? »",["En définitive, vivre sans télévision n'est plus un renoncement, mais le signe d'une évolution des usages. Reste à savoir si internet nous rend plus libres.","Voilà, merci de m'avoir écouté.","Et aussi, la télé coûte cher."],0,"Synthèse, réponse et ouverture."),
        C("Quelle formule ouvre la réflexion ?",["Reste à savoir si…","Tout d'abord,…","D'après le document,…"],0,"L'ouverture pose une nouvelle question."),
        C("Une conclusion ne doit pas…",["introduire un argument nouveau","reprendre la problématique","être courte"],0,"Les arguments appartiennent au développement."),
        F("En ___, le télétravail est une solution d'avenir, à condition d'en corriger les effets.",["définitive","somme"],"En définitive / En somme."),
        O(["On peut dès lors se demander","si l'université","pourra concilier","ces deux missions."],"Ouverture pour le sujet n° 3.")

const DOC_TT1=`Depuis la crise sanitaire, le télétravail s'est installé durablement dans de nombreuses entreprises. Pour les salariés, il représente d'abord un gain de temps : moins de trajets, moins de fatigue, une meilleure conciliation entre vie professionnelle et vie familiale. Les employeurs y trouvent aussi leur compte, puisqu'ils réduisent leurs dépenses de bureaux. Loin d'être une parenthèse, le travail à distance constitue selon moi une conquête sociale qu'il convient de généraliser à tous les métiers qui le permettent.`;
const DOC_TT2=`Si le télétravail séduit, il n'est pas sans risque. Beaucoup de salariés disent souffrir d'isolement : les échanges informels, qui nourrissent la créativité et la solidarité, disparaissent. La frontière entre temps de travail et temps personnel devient floue, au point que certains ne parviennent plus à se déconnecter. Le télétravail ne sera donc bénéfique que s'il reste partiel et encadré, par exemple deux jours par semaine.`;
const DOC_IA=`En quelques années, les outils d'intelligence artificielle générative se sont imposés dans la vie des étudiants. Il suffit désormais de quelques secondes pour obtenir un résumé, une dissertation ou la traduction d'un article. Cette facilité inquiète de nombreux enseignants, qui redoutent que leurs étudiants ne délèguent à la machine l'effort même de penser. Comment évaluer un devoir dont on ignore s'il a été rédigé par son auteur ? Comment former l'esprit critique si l'on n'apprend plus à construire un raisonnement ?

Pourtant, interdire ces outils semble aussi illusoire qu'inefficace. Les étudiants continueront à les utiliser, et le monde professionnel qui les attend en fera un usage quotidien. Plutôt que de lutter contre une évolution irréversible, l'université devrait donc apprendre à ses étudiants à s'en servir avec discernement : vérifier les sources, repérer les erreurs, comprendre les limites d'un texte produit automatiquement.

Cette transformation suppose aussi de repenser l'évaluation. Les examens oraux, les travaux réalisés en classe ou la présentation du processus de rédaction permettent de vérifier ce que l'étudiant a réellement compris. Loin de signer la fin de l'enseignement, l'intelligence artificielle pourrait ainsi l'obliger à se recentrer sur l'essentiel : apprendre à penser par soi-même.`;
const SOURCES={
  ia:[{t:"L'intelligence artificielle à l'université : menace ou chance ?",s:"Texte d'entraînement",x:DOC_IA}],
